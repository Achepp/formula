                <div className="space-y-6 animate-fade-in">
                    <div className="mb-6">
                        <h2 className="text-2xl font-bold text-slate-900 dark:text-white">Kelola User</h2>
                        <p className="text-sm text-slate-500 mt-1">Tambahkan dan atur hak akses staff Anda.</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-1 bg-white dark:bg-[#111827] rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm p-6 h-fit">
                            <h3 className="text-md font-bold mb-4 flex items-center"><Icon name="User" className="mr-2 text-brand-500"/> Tambah User Baru</h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div><label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Nama Lengkap</label><input type="text" value={formData['Nama Lengkap']} onChange={e => setFormData({...formData, 'Nama Lengkap': e.target.value})} className={inputClass} required/></div>
                                <div><label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Username</label><input type="text" value={formData.Username} onChange={e => setFormData({...formData, Username: e.target.value})} className={inputClass} required/></div>
                                <div><label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Password</label><input type="password" value={formData.Password} onChange={e => setFormData({...formData, Password: e.target.value})} className={inputClass} required placeholder="••••••" /></div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Akses Role</label>
                                    <select value={formData.Role} onChange={e => setFormData({...formData, Role: e.target.value})} className={inputClass}>
                                        <option value="User">User (Akses Standard)</option>
                                        <option value="Admin">Admin (Akses Penuh)</option>
                                    </select>
                                </div>
                                <button type="submit" disabled={isSubmitting} className="w-full py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg flex justify-center items-center">
                                    {isSubmitting ? <Icon name="Loader2" className="animate-spin-slow mr-2"/> : <Icon name="CheckCircle" className="mr-2"/>} Simpan User
                                </button>
                            </form>
                        </div>

                        <div className="lg:col-span-2 bg-white dark:bg-[#111827] rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-slate-50/50 dark:bg-slate-800/30 border-b border-slate-200 dark:border-slate-800">
                                    <tr>
                                        <th className="px-5 py-3 font-semibold text-slate-500 text-xs">Nama Lengkap</th>
                                        <th className="px-5 py-3 font-semibold text-slate-500 text-xs">Username</th>
                                        <th className="px-5 py-3 font-semibold text-slate-500 text-xs">Role</th>
                                        <th className="px-5 py-3 font-semibold text-slate-500 text-xs text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800/60">
                                    {users.length > 0 ? users.map((u, i) => (
                                        <tr key={i} className="hover:bg-slate-50 dark:hover:bg-slate-800/30">
                                            <td className="px-5 py-3 font-medium">{u['Nama Lengkap']}</td>
                                            <td className="px-5 py-3 text-slate-600 dark:text-slate-400">{u.Username}</td>
                                            <td className="px-5 py-3 text-brand-600 dark:text-brand-400 font-medium">{u.Role}</td>
                                            <td className="px-5 py-3 text-right">
                                                <button onClick={() => handleDelete(u.id, true)} className="p-1.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-md transition-colors focus:outline-none"><Icon name="Trash2" size={16} /></button>
                                            </td>
                                        </tr>
                                    )) : (
                                        <tr><td colSpan="4" className="px-5 py-8 text-center text-slate-500 text-sm">Tidak ada data pengguna.</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
