                                                    <span className="block text-xl font-bold text-emerald-600 dark:text-emerald-400 leading-tight">{Number(totalFormulasi.toFixed(5))}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Tabel Detail */}
                                    <div className="overflow-x-auto rounded-[14px] border border-slate-200 dark:border-white/[0.08]">
                                        <table className="w-full text-left text-sm whitespace-nowrap">
                                            <thead className="bg-slate-50/80 dark:bg-white/[0.03] border-b border-slate-200 dark:border-white/[0.08]">
                                                <tr>
                                                    <th className="px-4 py-3 font-semibold text-xs text-slate-500 uppercase tracking-wider w-12 text-center">No</th>
                                                    <th className="px-4 py-3 font-semibold text-xs text-slate-500 uppercase tracking-wider">Jenis Material</th>
                                                    <th className="px-4 py-3 font-semibold text-xs text-slate-500 uppercase tracking-wider text-right">Kebutuhan Dispense (Kg)</th>
                                                    <th className="px-4 py-3 font-semibold text-xs text-slate-500 uppercase tracking-wider text-center w-32">Pail</th>
                                                    <th className="px-4 py-3 font-semibold text-xs text-brand-500 uppercase tracking-wider text-right">Kg (Otomatis)</th>
                                                    <th className="px-4 py-3 font-semibold text-xs text-emerald-500 uppercase tracking-wider text-right">Formulasi (Otomatis)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 dark:divide-white/[0.04]">
                                                {computedMaterials.map((mat, idx) => (
                                                    <tr key={idx} className={`hover:bg-slate-50/60 dark:hover:bg-white/[0.02] transition-colors ${idx % 2 === 0 ? '' : 'bg-slate-50/30 dark:bg-white/[0.01]'}`}>
                                                        <td className="px-4 py-3 text-center text-slate-400 dark:text-slate-500 font-medium text-xs">{idx + 1}</td>
                                                        <td className="px-4 py-3 font-semibold text-slate-900 dark:text-slate-200 text-sm">{mat.material}</td>
                                                        <td className="px-4 py-3 text-slate-600 dark:text-slate-400 text-right">{Number(mat.qtyMaterial).toFixed(5)}</td>
                                                        <td className="px-4 py-3">
                                                            <input type="number" value={mat.pail} onChange={(e) => handlePailChange(mat.id, e.target.value)} className="w-full px-3 py-1.5 text-sm text-center bg-white dark:bg-white/[0.04] border border-slate-200 dark:border-white/10 rounded-lg focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none transition-all" />
                                                        </td>
                                                        <td className="px-4 py-3 font-semibold text-brand-600 dark:text-brand-400 text-right">{mat.calculatedKg.toFixed(5)}</td>
                                                        <td className="px-4 py-3 font-semibold text-emerald-600 dark:text-emerald-400 text-right">{mat.calculatedFormulasi.toFixed(4)}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                        </div>
                        
                        {/* Area Aksi Tombol */}
                        <div className="px-6 sm:px-8 py-4 bg-slate-50/80 dark:bg-white/[0.02] border-t border-black/[0.06] dark:border-white/[0.06] flex flex-col sm:flex-row items-center justify-end space-y-3 sm:space-y-0 sm:space-x-3 print-hide">
                            <button type="button" onClick={handleReset} className="w-full sm:w-auto px-5 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.06] rounded-xl transition-colors">
                                Reset Parameter
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function DataTableView({ formulas, isLoading, Icon, userRole, fetchData, showNotification }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [currentPage, setCurrentPage] = useState(1);
            const [expandedRows, setExpandedRows] = useState(new Set());
            const [groupToDelete, setGroupToDelete] = useState(null);
            const [isDeletingGroup, setIsDeletingGroup] = useState(false);
            
            // --- STATE UNTUK EDIT GROUP FORMULA ---
            const [groupToEdit, setGroupToEdit] = useState(null);
            const [editHeaderData, setEditHeaderData] = useState({ namaProduk: '', fa: '', rev: '', qty: '' });
            const [editMaterialsList, setEditMaterialsList] = useState([]);
            const [isSubmittingEdit, setIsSubmittingEdit] = useState(false);
            
            const itemsPerPage = 10;

            const inputClass = "w-full px-3.5 py-2.5 text-sm bg-white dark:bg-[#0a0d14] border border-slate-200 dark:border-white/10 rounded-xl focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none transition-all placeholder-slate-400 dark:placeholder-slate-600 text-slate-900 dark:text-slate-100 shadow-sm";
            const labelClass = "block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5 uppercase tracking-wider";


            const groupedFormulas = useMemo(() => {
                const groups = {};
                formulas.forEach(item => {
                    const qtyVal = item['Qty Total'] !== undefined ? item['Qty Total'] : item['QTY'];
                    const key = `${item['Nama Produk']}_${item['FA']}_${item['REV']}_${qtyVal}`;
                    if (!groups[key]) {
                        groups[key] = {
                            key, 'Nama Produk': item['Nama Produk'], 'FA': item['FA'], 'REV': item['REV'], 'QTY': qtyVal, materials: []
                        };
                    }
                    groups[key].materials.push(item);
                });
                return Object.values(groups);
            }, [formulas]);

            const filteredData = groupedFormulas.filter(group => {
                const searchLower = searchTerm.toLowerCase();
                return (
                    String(group['Nama Produk']).toLowerCase().includes(searchLower) ||
                    String(group['FA']).toLowerCase().includes(searchLower) ||
                    String(group['REV']).toLowerCase().includes(searchLower) ||
                    group.materials.some(mat => String(mat['Material']).toLowerCase().includes(searchLower))
                );
            });

            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            const currentData = filteredData.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            const toggleRow = (key) => {
                const newExpanded = new Set(expandedRows);
                if (newExpanded.has(key)) newExpanded.delete(key);
                else newExpanded.add(key);
                setExpandedRows(newExpanded);
            };

            const exportToCSV = () => {
                if(!formulas.length) return;
                const headers = ["Nama Produk", "FA", "REV", "Qty Total", "Material", "Kebutuhan Dispense", "Kg Otomatis", "Pail", "Formulasi"];
                const csvRows = [headers.join(',')];
                formulas.forEach(row => {
                    const qtyVal = row['Qty Total'] !== undefined ? row['Qty Total'] : row['QTY'];
                    const dispVal = row['Kebutuhan Dispense'] !== undefined ? row['Kebutuhan Dispense'] : row['Qty Material'];
                    const kgVal = row['Kg Otomatis'] !== undefined ? row['Kg Otomatis'] : row['Kg'];
                    const values = [
                        `"${('' + row['Nama Produk']).replace(/"/g, '\\"')}"`,
                        `"${('' + row['FA']).replace(/"/g, '\\"')}"`,
                        `"${('' + row['REV']).replace(/"/g, '\\"')}"`,
                        `"${('' + qtyVal).replace(/"/g, '\\"')}"`,
                        `"${('' + row['Material']).replace(/"/g, '\\"')}"`,
                        `"${('' + dispVal).replace(/"/g, '\\"')}"`,
                        `"${('' + kgVal).replace(/"/g, '\\"')}"`,
                        `"${('' + row['Pail']).replace(/"/g, '\\"')}"`,
                        `"${('' + row['Formulasi']).replace(/"/g, '\\"')}"`
                    ];
                    csvRows.push(values.join(','));
                });
                const link = document.createElement("a");
                link.setAttribute("href", encodeURI("data:text/csv;charset=utf-8," + csvRows.join('\n')));
                link.setAttribute("download", "data_formula.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleDeleteGroupConfirm = async () => {
                if (!groupToDelete) return;
                setIsDeletingGroup(true);
                try {
                    const idsToDelete = groupToDelete.materials.map(m => m.id).sort((a, b) => b - a);
                    for (const id of idsToDelete) {
                        const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
                            method: 'POST', body: JSON.stringify({ action: 'deleteFormula', id }),
                        });
                        if (!response.ok) throw new Error("Gagal menghapus baris");
                    }
                    await fetchData();
                    showNotification('Formula berhasil dihapus.', 'success');
                    setGroupToDelete(null);
                } catch (error) {
                    showNotification('Gagal menghapus formula. Silakan coba kembali.', 'error');
                } finally {
                    setIsDeletingGroup(false);
                }
            };

            // --- FUNGSI UNTUK EDIT GROUP FORMULA ---
            const openEditModal = (group) => {
                setEditHeaderData({
                    namaProduk: group['Nama Produk'] || '',
                    fa: group['FA'] || '',
                    rev: group['REV'] || '',
                    qty: group['QTY'] || ''
                });
                
                setEditMaterialsList(group.materials.map(m => {
                    const dispVal = m['Kebutuhan Dispense'] !== undefined ? m['Kebutuhan Dispense'] : m['Qty Material'];
                    return {
                        id: m.id || Date.now() + Math.random(),
                        material: m['Material'] || '',
                        qtyMaterial: dispVal || '',
                        pail: m['Pail'] || ''
                    };
                }));
                
                setGroupToEdit(group);
            };

            const handleEditHeaderChange = (e) => {
                const { name, value } = e.target;
                setEditHeaderData(prev => ({ ...prev, [name]: value }));
            };

            const handleEditMaterialChange = (id, field, value) => {
                if (field === 'qtyMaterial' && value.includes('.')) {
                    if (value.split('.')[1].length > 5) return showNotification('Kebutuhan Dispense (Kg) maksimal 5 angka di belakang koma.', 'error');
                }
                setEditMaterialsList(prev => prev.map(m => m.id === id ? { ...m, [field]: value } : m));
            };

            const addEditMaterialRow = () => setEditMaterialsList(prev => [...prev, { id: Date.now(), material: '', qtyMaterial: '', pail: '' }]);
            
            const removeEditMaterialRow = (id) => { 
                if (editMaterialsList.length > 1) setEditMaterialsList(prev => prev.filter(m => m.id !== id)); 
            };

            const handleSaveEdit = async (e) => {
                e.preventDefault();
                
                // 1. Validasi Input
                if (!editHeaderData.namaProduk || !editHeaderData.fa || !editHeaderData.qty) {
                    return showNotification('Mohon lengkapi Informasi Produk dan Qty Total', 'error');
                }
                for (let i = 0; i < editMaterialsList.length; i++) {
                    const m = editMaterialsList[i];
                    if (!m.material || !m.qtyMaterial || !m.pail) return showNotification(`Mohon lengkapi data Material ke-${i+1}`, 'error');
                }

                setIsSubmittingEdit(true);
                try {
                    // 2. Hapus Data Lama (dari bawah ke atas)
                    const idsToDelete = groupToEdit.materials.map(m => m.id).sort((a, b) => b - a);
                    for (const id of idsToDelete) {
                        const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
                            method: 'POST', body: JSON.stringify({ action: 'deleteFormula', id }),
                        });
                        if (!response.ok) throw new Error("Gagal menghapus baris lama");
                    }

                    // 3. Tambah Data Baru yang sudah diedit
                    for (const mat of editMaterialsList) {
                        const baseQty = Number(editHeaderData.qty);
                        const kg = (Number(mat.qtyMaterial) * baseQty) / 100;
                        const formulasi = baseQty !== 0 ? (Number(mat.pail) / baseQty) * kg : 0;
                        
                        const payload = { 
                            action: 'addFormula', 
                            data: { 
                                'Nama Produk': editHeaderData.namaProduk, 
                                'FA': editHeaderData.fa, 
                                'REV': editHeaderData.rev, 
                                'QTY': baseQty, 
                                'Material': mat.material, 
                                'Qty Material': Number(mat.qtyMaterial), 
                                'Kg': kg, 
                                'Pail': Number(mat.pail), 
                                'Formulasi': formulasi 
                            } 
                        };
                        const response = await fetch(GOOGLE_APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                        if(!response.ok) throw new Error("Gagal menyimpan pembaruan material");
                    }
                    
                    showNotification('Formula berhasil diperbarui!', 'success');
                    setGroupToEdit(null);
                    await fetchData();
                } catch (error) {
                    showNotification('Terjadi kesalahan saat memperbarui formula.', 'error');
                } finally {
                    setIsSubmittingEdit(false);
                }
            };

            return (
                <div className="bg-white dark:bg-[#111420] rounded-[20px] border border-black/[0.06] dark:border-white/[0.06] shadow-card flex flex-col animate-fade-in relative print-border">
                    {/* Header */}
                    <div className="px-5 sm:px-6 py-4 border-b border-black/[0.06] dark:border-white/[0.06] flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h3 className="text-lg font-bold text-slate-900 dark:text-white">Master Formula</h3>
                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Total {groupedFormulas.length} kombinasi formula · {formulas.length} data material</p>
                        </div>
                        <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 w-full sm:w-auto print-hide">
                            <div className="relative flex-1 sm:w-60">
                                <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="Search" size={15} /></div>
                                <input 
                                    type="text" placeholder="Cari formula atau material..." value={searchTerm} onChange={(e) => { setSearchTerm(e.target.value); setCurrentPage(1); }}
                                    className="w-full pl-9 pr-4 py-2.5 text-sm bg-slate-50 dark:bg-white/[0.04] border border-slate-200 dark:border-white/[0.08] rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all placeholder-slate-400 text-slate-900 dark:text-slate-100"
                                />
                            </div>
                            <button onClick={exportToCSV} className="flex items-center justify-center space-x-2 bg-white dark:bg-white/[0.04] border border-slate-200 dark:border-white/[0.08] hover:bg-slate-50 dark:hover:bg-white/[0.07] text-slate-700 dark:text-slate-300 px-4 py-2.5 rounded-xl text-sm font-semibold transition-all shadow-sm focus:outline-none whitespace-nowrap">
                                <Icon name="Download" size={15} /> <span>Ekspor CSV</span>
                            </button>
                        </div>
                    </div>

                    <div className="overflow-x-auto">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-slate-50/50 dark:bg-white/[0.02] border-b border-black/[0.06] dark:border-white/[0.06]">
                                <tr>
                                    <th className="px-5 py-3.5 font-semibold text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider w-14">No</th>
                                    <th className="px-5 py-3.5 font-semibold text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider">Nama Produk</th>
                                    <th className="px-5 py-3.5 font-semibold text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider">FA / REV</th>
                                    <th className="px-5 py-3.5 font-semibold text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider">Qty Total</th>
                                    <th className="px-5 py-3.5 font-semibold text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider">Material</th>
                                    <th className="px-5 py-3.5 font-semibold text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider text-right print-hide">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-black/[0.04] dark:divide-white/[0.04]">
                                {currentData.length > 0 ? currentData.map((group, idx) => {
                                    const isExpanded = expandedRows.has(group.key);
                                    const globalIndex = (currentPage - 1) * itemsPerPage + idx + 1;
                                    return (
                                        <Fragment key={group.key}>
                                            <tr className={`hover:bg-slate-50/60 dark:hover:bg-white/[0.02] cursor-pointer transition-colors ${isExpanded ? 'bg-brand-50/30 dark:bg-brand-900/10' : ''}`} onClick={() => toggleRow(group.key)}>
                                                <td className="px-5 py-4 text-slate-400 dark:text-slate-500 font-medium text-xs">{globalIndex}</td>
                                                <td className="px-5 py-4 font-semibold text-slate-900 dark:text-slate-100">{group['Nama Produk']}</td>
                                                <td className="px-5 py-4">
                                                    <span className="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-white/[0.08] dark:text-slate-300">
                                                        {group['FA']}/{group['REV'] || '—'}
                                                    </span>
                                                </td>
                                                <td className="px-5 py-4 text-slate-600 dark:text-slate-400 font-medium">{group['QTY']}</td>
                                                <td className="px-5 py-4">
                                                    <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-brand-50 text-brand-600 dark:bg-brand-500/10 dark:text-brand-400">
                                                        {group.materials.length} Material
                                                    </span>
                                                </td>
                                                <td className="px-5 py-4 text-right print-hide">
                                                    <div className="flex items-center justify-end space-x-1.5">
                                                        <button onClick={(e) => { e.stopPropagation(); toggleRow(group.key); }} className="flex items-center space-x-1 px-3 py-1.5 bg-slate-100 dark:bg-white/[0.06] hover:bg-slate-200 dark:hover:bg-white/10 text-slate-700 dark:text-slate-300 rounded-lg text-xs font-semibold transition-colors focus:outline-none">
                                                            <span>Detail</span><Icon name={isExpanded ? "ChevronUp" : "ChevronDown"} size={13} />
                                                        </button>
                                                        {userRole === 'Admin' && (
                                                            <Fragment>
                                                                <button 
                                                                    onClick={(e) => { e.stopPropagation(); openEditModal(group); }} 
                                                                    className="p-1.5 bg-slate-100 dark:bg-white/[0.06] hover:bg-brand-50 hover:text-brand-600 dark:hover:bg-brand-500/10 dark:hover:text-brand-400 text-slate-500 dark:text-slate-400 rounded-lg transition-all focus:outline-none"
                                                                    title="Edit Formula Group"
                                                                >
                                                                    <Icon name="Edit" size={14} />
                                                                </button>
                                                                <button 
                                                                    onClick={(e) => { e.stopPropagation(); setGroupToDelete(group); }} 
                                                                    className="p-1.5 bg-slate-100 dark:bg-white/[0.06] hover:bg-rose-50 hover:text-rose-500 dark:hover:bg-rose-900/20 dark:hover:text-rose-400 text-slate-500 dark:text-slate-400 rounded-lg transition-all focus:outline-none"
                                                                    title={`Hapus seluruh formula beserta ${group.materials.length} material yang terkait.`}
                                                                >
                                                                    <Icon name="Trash2" size={14} />
                                                                </button>
                                                            </Fragment>
                                                        )}
                                                    </div>
                                                </td>
                                            </tr>
                                            {isExpanded && (
                                                <tr>
                                                    <td colSpan="6" className="p-0 bg-slate-50/30 dark:bg-white/[0.01]">
                                                        <div className="mx-4 sm:mx-6 my-3 rounded-[14px] overflow-hidden border border-slate-200 dark:border-white/[0.08] animate-slide-in-up print-border" style={{borderLeft:'3px solid #6366f1'}}>
                                                            <div className="overflow-x-auto p-4">
                                                                <table className="w-full text-left text-xs whitespace-nowrap">
                                                                    <thead className="bg-slate-50 dark:bg-white/[0.03] border-b border-slate-200 dark:border-white/[0.08]">
                                                                        <tr>
                                                                            <th className="px-4 py-2.5 font-semibold text-slate-500 uppercase tracking-wider w-10">No</th>
                                                                            <th className="px-4 py-2.5 font-semibold text-slate-500 uppercase tracking-wider">Material</th>
                                                                            <th className="px-4 py-2.5 font-semibold text-slate-500 uppercase tracking-wider text-right">Kebutuhan Dispense</th>
                                                                            <th className="px-4 py-2.5 font-semibold text-slate-500 uppercase tracking-wider text-right">Kg Otomatis</th>
                                                                            <th className="px-4 py-2.5 font-semibold text-slate-500 uppercase tracking-wider text-right">Pail</th>
                                                                            <th className="px-4 py-2.5 font-semibold text-brand-500 uppercase tracking-wider text-right">Formulasi</th>
                                                                        </tr>
                                                                    </thead>
                                                                    <tbody className="divide-y divide-slate-100 dark:divide-white/[0.04]">
                                                                        {group.materials.map((mat, mIdx) => {
                                                                            const dispVal = mat['Kebutuhan Dispense'] !== undefined ? mat['Kebutuhan Dispense'] : mat['Qty Material'];
                                                                            const kgVal = mat['Kg Otomatis'] !== undefined ? mat['Kg Otomatis'] : mat['Kg'];
                                                                            return (
                                                                                <tr key={mIdx} className={`hover:bg-slate-50 dark:hover:bg-white/[0.02] transition-colors ${mIdx % 2 !== 0 ? 'bg-slate-50/30 dark:bg-white/[0.01]' : ''}`}>
                                                                                    <td className="px-4 py-2.5 text-slate-400">{mIdx + 1}</td>
                                                                                    <td className="px-4 py-2.5 font-semibold text-slate-800 dark:text-slate-200">{mat['Material']}</td>
                                                                                    <td className="px-4 py-2.5 text-slate-500 dark:text-slate-400 text-right">{dispVal !== '' && dispVal !== undefined ? Number(Number(dispVal).toFixed(5)) : '—'}</td>
                                                                                    <td className="px-4 py-2.5 text-slate-500 dark:text-slate-400 text-right">{kgVal !== '' && kgVal !== undefined ? Number(Number(kgVal).toFixed(5)) : '—'}</td>
                                                                                    <td className="px-4 py-2.5 text-slate-500 dark:text-slate-400 text-right">{mat['Pail'] || '—'}</td>
                                                                                    <td className="px-4 py-2.5 font-bold text-brand-600 dark:text-brand-400 text-right">{Number(mat['Formulasi']).toFixed(4)}</td>
                                                                                </tr>
                                                                            );
                                                                        })}
                                                                    </tbody>
                                                                </table>
                                                                <div className="mt-3 flex flex-col sm:flex-row sm:space-x-8 space-y-1.5 sm:space-y-0 p-3 bg-slate-50 dark:bg-white/[0.02] rounded-xl border border-slate-100 dark:border-white/[0.06]">
                                                                    <div className="text-xs font-medium text-slate-500">Total Material : <span className="font-bold text-slate-900 dark:text-white ml-1">{group.materials.length}</span></div>
                                                                    <div className="text-xs font-medium text-slate-500">Total Formulasi : <span className="font-bold text-brand-600 dark:text-brand-400 ml-1">{group.materials.reduce((sum, mat) => sum + Number(mat['Formulasi'] || 0), 0).toFixed(4)}</span></div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                        </Fragment>
                                    );
                                }) : (
                                    <tr>
                                        <td colSpan="6" className="px-5 py-16 text-center">
                                            <div className="flex flex-col items-center">
                                                <div className="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-white/[0.04] flex items-center justify-center mb-3">
                                                    {isLoading 
                                                        ? <Icon name="Loader2" size={20} className="animate-spin-slow text-brand-500" />
                                                        : <Icon name="Database" size={20} className="text-slate-400" />
                                                    }
                                                </div>
                                                <p className="text-sm text-slate-500 font-medium">{isLoading ? 'Menarik data...' : 'Tidak ada data ditemukan'}</p>
                                            </div>
                                        </td>
                                    </tr>
                                )}
                            </tbody>
                        </table>
                    </div>

                    {totalPages > 1 && (
                        <div className="px-5 sm:px-6 py-4 border-t border-black/[0.06] dark:border-white/[0.06] flex flex-col sm:flex-row justify-between items-center gap-3 print-hide">
                            <span className="text-xs text-slate-500">Menampilkan <span className="font-semibold text-slate-800 dark:text-slate-200">{((currentPage - 1) * itemsPerPage) + 1}</span>–<span className="font-semibold text-slate-800 dark:text-slate-200">{Math.min(currentPage * itemsPerPage, filteredData.length)}</span> dari <span className="font-semibold text-slate-800 dark:text-slate-200">{filteredData.length}</span> formula</span>
                            <div className="flex items-center space-x-1.5">
                                <button disabled={currentPage === 1} onClick={() => setCurrentPage(prev => Math.max(1, prev - 1))} className="px-3.5 py-1.5 rounded-xl border border-slate-200 dark:border-white/10 text-xs font-semibold text-slate-600 dark:text-slate-400 disabled:opacity-40 hover:bg-slate-50 dark:hover:bg-white/[0.06] focus:outline-none transition-colors">← Prev</button>
                                {Array.from({length: Math.min(5, totalPages)}, (_, i) => {
                                    const page = totalPages <= 5 ? i + 1 : Math.max(1, Math.min(currentPage - 2, totalPages - 4)) + i;
                                    return (
                                        <button key={page} onClick={() => setCurrentPage(page)} className={`w-8 h-8 rounded-xl text-xs font-semibold transition-colors focus:outline-none ${currentPage === page ? 'btn-brand text-white' : 'border border-slate-200 dark:border-white/10 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-white/[0.06]'}`}>{page}</button>
                                    );
                                })}
                                <button disabled={currentPage === totalPages} onClick={() => setCurrentPage(prev => Math.min(totalPages, prev + 1))} className="px-3.5 py-1.5 rounded-xl border border-slate-200 dark:border-white/10 text-xs font-semibold text-slate-600 dark:text-slate-400 disabled:opacity-40 hover:bg-slate-50 dark:hover:bg-white/[0.06] focus:outline-none transition-colors">Next →</button>
                            </div>
                        </div>
                    )}

                    {/* --- MODAL KONFIRMASI HAPUS GROUP FORMULA --- */}
                    {groupToDelete && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in print-hide" style={{background:'rgba(0,0,0,0.55)',backdropFilter:'blur(8px)'}}>
                            <div className="bg-white dark:bg-[#111420] rounded-[24px] shadow-modal border border-black/[0.08] dark:border-white/[0.08] max-w-sm w-full p-6 animate-zoom-in">
                                <div className="flex items-center justify-center w-12 h-12 mx-auto rounded-2xl bg-rose-50 dark:bg-rose-900/20 mb-4">
                                    <Icon name="AlertTriangle" size={22} className="text-rose-500" />
                                </div>
                                <h3 className="text-lg font-bold text-center text-slate-900 dark:text-white mb-1.5">Hapus Formula?</h3>
                                <p className="text-sm text-center text-slate-500 dark:text-slate-400 mb-5">Formula berikut akan dihapus secara permanen dan tidak dapat dikembalikan.</p>
                                
                                <div className="rounded-xl p-4 mb-5 space-y-2 text-sm" style={{background:'rgba(244,63,94,0.06)',border:'1px solid rgba(244,63,94,0.12)'}}>
                                    <div className="flex"><span className="w-24 text-slate-500 shrink-0 text-xs">Nama Produk</span><span className="font-semibold text-slate-800 dark:text-slate-200 text-xs truncate">: {groupToDelete['Nama Produk']}</span></div>
                                    <div className="flex"><span className="w-24 text-slate-500 shrink-0 text-xs">FA / REV</span><span className="font-semibold text-slate-800 dark:text-slate-200 text-xs">: {groupToDelete['FA']} / {groupToDelete['REV'] || '—'}</span></div>
                                    <div className="flex"><span className="w-24 text-slate-500 shrink-0 text-xs">Qty Total</span><span className="font-semibold text-slate-800 dark:text-slate-200 text-xs">: {groupToDelete['QTY']}</span></div>
                                    <div className="flex"><span className="w-24 text-slate-500 shrink-0 text-xs">Material</span><span className="font-semibold text-rose-500 text-xs">: {groupToDelete.materials.length} Material</span></div>
                                </div>
                                
                                <div className="flex space-x-3">
                                    <button 
                                        onClick={() => setGroupToDelete(null)}
                                        disabled={isDeletingGroup}
                                        className="flex-1 h-11 text-sm font-semibold text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-white/[0.06] hover:bg-slate-200 dark:hover:bg-white/10 rounded-[14px] transition-colors disabled:opacity-50 focus:outline-none"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        onClick={handleDeleteGroupConfirm}
                                        disabled={isDeletingGroup}
                                        className="flex-1 h-11 flex items-center justify-center text-sm font-semibold text-white bg-rose-500 hover:bg-rose-600 rounded-[14px] transition-colors disabled:opacity-70 focus:outline-none"
                                        style={{boxShadow:'0 4px 14px rgba(244,63,94,0.30)'}}
                                    >
                                        {isDeletingGroup ? <><Icon name="Loader2" size={15} className="animate-spin-slow mr-2" /><span>Menghapus...</span></> : 'Ya, Hapus'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- MODAL EDIT GROUP FORMULA --- */}
                    {groupToEdit && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 animate-fade-in print-hide" style={{background:'rgba(0,0,0,0.55)',backdropFilter:'blur(8px)'}}>
                            <div className="bg-white dark:bg-[#111420] rounded-[24px] shadow-modal border border-black/[0.08] dark:border-white/[0.08] w-full max-w-4xl max-h-[92vh] flex flex-col animate-zoom-in overflow-hidden">
                                
                                {/* Modal Header */}
                                <div className="px-6 py-4 border-b border-black/[0.06] dark:border-white/[0.06] flex justify-between items-center shrink-0">
                                    <div className="flex items-center space-x-3">
                                        <div className="w-8 h-8 rounded-xl icon-brand flex items-center justify-center">
                                            <Icon name="Edit" size={15} className="text-white" />
                                        </div>
                                        <div>
                                            <h3 className="text-sm font-bold text-slate-900 dark:text-white">Edit Formula Group</h3>
                                            <p className="text-xs text-slate-400">{groupToEdit['Nama Produk']}</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setGroupToEdit(null)} className="w-8 h-8 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-white/[0.06] flex items-center justify-center transition-all focus:outline-none">
                                        <Icon name="X" size={18} />
                                    </button>
                                </div>

                                {/* Modal Body (Scrollable Form) */}
                                <div className="p-6 overflow-y-auto flex-1">
                                    <div className="space-y-6">
                                        {/* Edit Informasi Produk */}
                                        <div className="p-5 rounded-[16px] border border-slate-200/80 dark:border-white/[0.08] bg-slate-50/50 dark:bg-white/[0.02]">
                                            <div className="flex items-center space-x-2.5 mb-4">
                                                <div className="w-6 h-6 rounded-lg icon-brand flex items-center justify-center shrink-0">
                                                    <Icon name="Package" size={12} className="text-white" />
                                                </div>
                                                <h4 className="text-sm font-bold text-slate-900 dark:text-white">Informasi Produk</h4>
                                            </div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                <div className="sm:col-span-2"><label className={labelClass}>Nama Produk <span className="text-rose-500">*</span></label><input type="text" name="namaProduk" value={editHeaderData.namaProduk} onChange={handleEditHeaderChange} className={inputClass} required /></div>
                                                <div><label className={labelClass}>Kategori FA <span className="text-rose-500">*</span></label><input type="text" name="fa" value={editHeaderData.fa} onChange={handleEditHeaderChange} className={inputClass} required /></div>
                                                <div><label className={labelClass}>Revisi (REV)</label><input type="text" name="rev" value={editHeaderData.rev} onChange={handleEditHeaderChange} className={inputClass} /></div>
                                                <div className="sm:col-span-2">
                                                    <label className={labelClass}>Qty Total <span className="text-rose-500">*</span></label>
                                                    <input type="number" name="qty" value={editHeaderData.qty} onChange={handleEditHeaderChange} className={inputClass} required min="1" step="any" />
                                                </div>
                                            </div>
                                        </div>

                                        {/* Edit Detail Material */}
                                        <div>
                                            <div className="flex items-center space-x-2.5 mb-4">
                                                <div className="w-6 h-6 rounded-lg icon-emerald flex items-center justify-center shrink-0">
                                                    <Icon name="Layers" size={12} className="text-white" />
                                                </div>
                                                <h4 className="text-sm font-bold text-slate-900 dark:text-white">Detail Material</h4>
                                            </div>
                                            <div className="space-y-4">
                                                {editMaterialsList.map((mat, index) => {
                                                    const baseQty = Number(editHeaderData.qty) || 0;
                                                    const kg = baseQty ? (Number(mat.qtyMaterial) * baseQty) / 100 : 0;
                                                    const formulasi = baseQty && kg ? (Number(mat.pail) / baseQty) * kg : 0;

                                                    return (
                                                        <div key={mat.id} className="p-5 rounded-[16px] border border-slate-200 dark:border-white/[0.08] bg-white dark:bg-[#111420] shadow-sm relative group">
                                                            {editMaterialsList.length > 1 && (
                                                                <button type="button" onClick={() => removeEditMaterialRow(mat.id)} className="absolute top-4 right-4 w-7 h-7 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/20 flex items-center justify-center focus:outline-none opacity-0 group-hover:opacity-100 transition-all" title="Hapus Material">
                                                                    <Icon name="Trash2" size={14} />
                                                                </button>
                                                            )}
                                                            <div className="flex items-center space-x-2 mb-4">
                                                                <div className="w-5 h-5 rounded-md icon-brand flex items-center justify-center text-[10px] font-bold text-white">{index + 1}</div>
                                                                <span className="text-xs font-bold text-brand-600 dark:text-brand-400 uppercase tracking-wider">Material {index + 1}</span>
                                                            </div>
                                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                                                                <div className="sm:col-span-1"><label className={labelClass}>Jenis Material <span className="text-rose-500">*</span></label><input type="text" value={mat.material} onChange={(e) => handleEditMaterialChange(mat.id, 'material', e.target.value)} className={inputClass} required /></div>
                                                                <div><label className={labelClass}>Kebutuhan Dispense (Kg) <span className="text-rose-500">*</span></label><input type="number" value={mat.qtyMaterial} onChange={(e) => handleEditMaterialChange(mat.id, 'qtyMaterial', e.target.value)} className={inputClass} required min="0" step="0.00001" /></div>
                                                                <div><label className={labelClass}>Pail <span className="text-rose-500">*</span></label><input type="number" value={mat.pail} onChange={(e) => handleEditMaterialChange(mat.id, 'pail', e.target.value)} className={inputClass} required min="0" step="any" /></div>
                                                            </div>
                                                            <div className="grid grid-cols-2 gap-4 pt-4 border-t border-slate-100 dark:border-white/[0.06]">
                                                                <div className="bg-slate-50 dark:bg-white/[0.04] rounded-xl p-3 border border-slate-200/60 dark:border-white/[0.06]">
                                                                    <p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">Kg (Otomatis)</p>
                                                                    <p className="text-sm font-bold text-slate-800 dark:text-slate-200">{kg.toFixed(5)}</p>
                                                                </div>
                                                                <div className="bg-brand-50 dark:bg-brand-500/[0.08] rounded-xl p-3 border border-brand-100 dark:border-brand-500/20">
                                                                    <p className="text-[10px] text-brand-500 uppercase tracking-widest font-bold mb-1">Formulasi (Otomatis)</p>
                                                                    <p className="text-sm font-bold text-brand-600 dark:text-brand-400">{formulasi.toFixed(4)}</p>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            <button type="button" onClick={addEditMaterialRow} className="mt-4 inline-flex items-center px-4 py-2.5 rounded-xl text-sm font-semibold text-brand-600 dark:text-brand-400 border-2 border-dashed border-brand-200 dark:border-brand-800/50 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition-all focus:outline-none">
                                                <Icon name="FilePlus" size={16} className="mr-2" /> + Tambah Material
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Modal Footer */}
                                <div className="px-6 py-4 border-t border-black/[0.06] dark:border-white/[0.06] bg-slate-50/80 dark:bg-white/[0.02] flex justify-end space-x-3 shrink-0">
                                    <button 
                                        type="button" 
                                        onClick={() => setGroupToEdit(null)} 
                                        disabled={isSubmittingEdit}
                                        className="px-5 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/[0.06] rounded-xl transition-colors disabled:opacity-50"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={handleSaveEdit} 
                                        disabled={isSubmittingEdit} 
                                        className="px-6 py-2.5 text-white text-sm font-semibold rounded-xl flex items-center justify-center transition-all disabled:opacity-60 btn-brand"
                                    >
                                        {isSubmittingEdit 
                                            ? <><Icon name="Loader2" size={15} className="animate-spin-slow mr-2" /><span>Menyimpan...</span></>
                                            : <><Icon name="CheckCircle" size={15} className="mr-2" /><span>Simpan Perubahan</span></>
                                        }
                                    </button>
                                </div>
                                
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function UserManagementView({ users, fetchData, showNotification, Icon }) {
            const [formData, setFormData] = useState({ Username: '', Password: '', 'Nama Lengkap': '', Role: 'User' });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.Username || !formData.Password || !formData['Nama Lengkap']) return showNotification('Lengkapi semua data', 'error');

                setIsSubmitting(true);
                try {
                    const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
                        method: 'POST', body: JSON.stringify({ action: 'addUser', data: formData })
                    });
                    const resData = await response.json();
                    if(resData.status !== 'success') throw new Error(resData.message || "Gagal menyimpan");
                    
                    showNotification('User berhasil ditambahkan');
                    setFormData({ Username: '', Password: '', 'Nama Lengkap': '', Role: 'User' });
                    fetchData();
                } catch (error) {
                    showNotification(error.message || 'Terjadi kesalahan server', 'error');
                } finally {
                    setIsSubmitting(false);
                }
            };

            const inputClass = "w-full px-3.5 py-2.5 text-sm bg-white dark:bg-[#0a0d14] border border-slate-200 dark:border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all text-slate-900 dark:text-white shadow-sm placeholder-slate-400 dark:placeholder-slate-600";
            const labelClass = "block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5 uppercase tracking-wider";

            const avatarColors = ['icon-brand','icon-emerald','icon-amber','icon-rose','icon-violet','icon-cyan'];

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="mb-7">
                        <h2 className="text-[26px] font-bold text-slate-900 dark:text-white tracking-tight">Kelola User</h2>
                        <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Tambahkan dan atur hak akses staff Anda.</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-5 lg:gap-6">
                        {/* Form tambah user */}
                        <div className="lg:col-span-1 bg-white dark:bg-[#111420] rounded-[20px] border border-black/[0.06] dark:border-white/[0.06] shadow-card p-6 h-fit">
                            <div className="flex items-center space-x-2.5 mb-6 pb-4 border-b border-black/[0.06] dark:border-white/[0.06]">
                                <div className="w-8 h-8 rounded-xl icon-brand flex items-center justify-center">
                                    <Icon name="User" size={15} className="text-white" />
                                </div>
                                <div>
                                    <h3 className="text-sm font-bold text-slate-900 dark:text-white">Tambah User Baru</h3>
                                    <p className="text-xs text-slate-400">Isi data akun baru</p>
                                </div>
                            </div>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div><label className={labelClass}>Nama Lengkap</label><input type="text" value={formData['Nama Lengkap']} onChange={e => setFormData({...formData, 'Nama Lengkap': e.target.value})} className={inputClass} required placeholder="John Doe"/></div>
                                <div><label className={labelClass}>Username</label><input type="text" value={formData.Username} onChange={e => setFormData({...formData, Username: e.target.value})} className={inputClass} required placeholder="johndoe"/></div>
                                <div><label className={labelClass}>Password</label><input type="password" value={formData.Password} onChange={e => setFormData({...formData, Password: e.target.value})} className={inputClass} required placeholder="••••••" /></div>
                                <div>
                                    <label className={labelClass}>Akses Role</label>
                                    <div className="relative">
                                        <select value={formData.Role} onChange={e => setFormData({...formData, Role: e.target.value})} className={`${inputClass} appearance-none cursor-pointer`}>
                                            <option value="User">User (Akses Standard)</option>
                                            <option value="Admin">Admin (Akses Penuh)</option>
                                        </select>
                                        <div className="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400"><Icon name="ChevronDown" size={15}/></div>
                                    </div>
                                </div>
                                <button type="submit" disabled={isSubmitting} className="w-full py-2.5 text-white text-sm font-semibold rounded-xl flex justify-center items-center mt-2 transition-all disabled:opacity-60 btn-brand">
                                    {isSubmitting 
                                        ? <><Icon name="Loader2" size={15} className="animate-spin-slow mr-2" /><span>Menyimpan...</span></>
                                        : <><Icon name="CheckCircle" size={15} className="mr-2" /><span>Simpan User</span></>
                                    }
                                </button>
                            </form>
                        </div>

                        {/* Daftar user */}
                        <div className="lg:col-span-2 bg-white dark:bg-[#111420] rounded-[20px] border border-black/[0.06] dark:border-white/[0.06] shadow-card overflow-hidden">
                            <div className="px-5 sm:px-6 py-4 border-b border-black/[0.06] dark:border-white/[0.06]">
                                <h3 className="text-sm font-bold text-slate-900 dark:text-white">Daftar Pengguna</h3>
                                <p className="text-xs text-slate-400 mt-0.5">{users.length} akun terdaftar</p>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-slate-50/50 dark:bg-white/[0.02] border-b border-black/[0.06] dark:border-white/[0.06]">
                                        <tr>
                                            <th className="px-5 py-3.5 font-semibold text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider">Pengguna</th>
                                            <th className="px-5 py-3.5 font-semibold text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider">Username</th>
                                            <th className="px-5 py-3.5 font-semibold text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider">Role</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-black/[0.04] dark:divide-white/[0.04]">
                                        {users.length > 0 ? users.map((u, i) => (
                                            <tr key={i} className="hover:bg-slate-50/60 dark:hover:bg-white/[0.02] transition-colors">
                                                <td className="px-5 py-3.5">
                                                    <div className="flex items-center space-x-3">
                                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0 ${avatarColors[i % avatarColors.length]}`}>
                                                            {(u['Nama Lengkap'] || '?').charAt(0).toUpperCase()}
                                                        </div>
                                                        <span className="font-semibold text-slate-900 dark:text-slate-100">{u['Nama Lengkap']}</span>
                                                    </div>
                                                </td>
                                                <td className="px-5 py-3.5 text-slate-500 dark:text-slate-400 font-medium">{u.Username}</td>
                                                <td className="px-5 py-3.5">
                                                    <span className={`inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold ${u.Role === 'Admin' ? 'bg-violet-50 text-violet-600 dark:bg-violet-900/20 dark:text-violet-400 border border-violet-100 dark:border-violet-800/30' : 'bg-slate-100 text-slate-600 dark:bg-white/[0.06] dark:text-slate-400'}`}>
                                                        {u.Role}
                                                    </span>
                                                </td>
                                            </tr>
                                        )) : (
                                            <tr>
                                                <td colSpan="3" className="px-5 py-14 text-center">
                                                    <div className="flex flex-col items-center">
                                                        <div className="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-white/[0.04] flex items-center justify-center mb-3">
                                                            <Icon name="Users" size={20} className="text-slate-400" />
                                                        </div>
                                                        <p className="text-sm text-slate-400 font-medium">Tidak ada data pengguna.</p>
                                                    </div>
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
</html>
