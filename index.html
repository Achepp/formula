<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormulaPro</title>
    <link rel="icon" href="https://iili.io/C3ty5x9.jpg" type="image/jpeg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes wave { 
            0% { transform: rotate(0deg); } 
            10% { transform: rotate(14deg); } 
            20% { transform: rotate(-8deg); } 
            30% { transform: rotate(14deg); } 
            40% { transform: rotate(-4deg); } 
            50% { transform: rotate(10deg); } 
            60% { transform: rotate(0deg); } 
            100% { transform: rotate(0deg); } 
        }
        
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slide-in-up { animation: slideInUp 0.4s ease-out forwards; }
        .animate-zoom-in { animation: zoomIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-wave { animation: wave 2.5s infinite; transform-origin: 70% 70%; display: inline-block; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin 1s linear infinite; }

        @media print {
            body { background: white !important; color: black !important; }
            .print-hide { display: none !important; }
            .print-full-width { margin: 0 !important; padding: 0 !important; max-width: 100% !important; width: 100% !important; }
            .print-border { border: 1px solid #e2e8f0 !important; box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-[#0B1120] text-slate-900 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Fragment } = React;

        // WAJIB: Ganti URL ini dengan URL Web App dari Google Apps Script Anda setelah di-deploy ulang.
        const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxxwqWWJqooskamVtbhEfZp4mlv7Ug0SC3DLyChhYg0TBVKpFHgWrALJP0859kcjFJx/exec'; 

        const Icon = ({ name, size = 18, className = "" }) => {
            const icons = {
                Home: <><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></>,
                FilePlus: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="12" x2="12" y1="18" y2="12"/><line x1="9" x2="15" y1="15" y2="15"/></>,
                Calculator: <><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></>,
                Database: <><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></>,
                Sun: <><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></>,
                Moon: <><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></>,
                Menu: <><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>,
                X: <><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></>,
                Activity: <><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></>,
                CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></>,
                AlertCircle: <><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>,
                AlertTriangle: <><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></>,
                Loader2: <><path d="M21 12a9 9 0 1 1-6.219-8.56"/></>,
                TrendingUp: <><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>,
                Package: <><line x1="16.5" x2="7.5" y1="9.4" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" x2="12" y1="22.08" y2="12"/></>,
                Layers: <><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></>,
                BarChart3: <><path d="M3 3v18h18"/><rect width="4" height="7" x="7" y="10" rx="1"/><rect width="4" height="12" x="15" y="5" rx="1"/></>,
                ArrowUpRight: <><path d="M7 7h10v10"/><path d="M7 17 17 7"/></>,
                Search: <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>,
                Download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>,
                Trash2: <><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>,
                Edit: <><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></>,
                ChevronDown: <><polyline points="6 9 12 15 18 9"/></>,
                ChevronUp: <><polyline points="18 15 12 9 6 15"/></>,
                LogOut: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></>,
                Eye: <><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></>,
                EyeOff: <><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></>,
                Lock: <><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
                User: <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
                Users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
                Settings: <><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>,
                Printer: <><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></>,
                RefreshCw: <><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>,
                ArrowRight: <><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        // --- KOMPONEN LOGIN ---
        function LoginView({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');

                if (!username || !password) {
                    setError('Username dan Password wajib diisi.');
                    return;
                }

                setIsLoading(true);

                if (!GOOGLE_APPS_SCRIPT_URL || GOOGLE_APPS_SCRIPT_URL === 'GANTI_DENGAN_URL_WEB_APP_ANDA') {
                    setTimeout(() => {
                        if (username === 'admin' && password === 'admin') {
                            onLogin({ Username: 'admin', 'Nama Lengkap': 'Administrator (Mock)', Role: 'Admin' });
                        } else if (username === 'user' && password === 'user') {
                            onLogin({ Username: 'user', 'Nama Lengkap': 'Staff User (Mock)', Role: 'User' });
                        } else {
                            setError('Mode Preview: Gunakan admin/admin atau user/user');
                        }
                        setIsLoading(false);
                    }, 1000);
                    return;
                }

                try {
                    const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'login', username, password })
                    });
                    const result = await response.json();

                    if (result.status === 'success') {
                        onLogin(result.user);
                    } else {
                        setError(result.message || 'Gagal login, periksa kembali kredensial Anda.');
                    }
                } catch (err) {
                    setError('Terjadi kesalahan koneksi ke server.');
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-slate-50 dark:bg-[#0B1120] relative overflow-hidden print-hide">
                    <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-brand-500/20 rounded-full blur-3xl"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-indigo-500/20 rounded-full blur-3xl"></div>

                    <div className="w-full max-w-[400px] bg-white dark:bg-[#111827] rounded-3xl shadow-2xl border border-slate-200/80 dark:border-slate-800 p-8 sm:p-10 relative z-10 animate-zoom-in">
                        <div className="text-center mb-8">
                            <div className="mx-auto w-14 h-14 bg-brand-600 rounded-[18px] flex items-center justify-center mb-5 shadow-lg shadow-brand-500/30">
                                <Icon name="Activity" size={28} className="text-white" />
                            </div>
                            <h1 className="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">FormulaPro</h1>
                            <p className="text-sm text-slate-500 dark:text-slate-400 mt-2">Masuk ke sistem formulasi enterprise</p>
                        </div>

                        {error && (
                            <div className="mb-6 p-3 bg-red-50 border border-red-200 dark:bg-red-900/20 dark:border-red-800/50 rounded-xl flex items-start space-x-2 text-sm text-red-600 dark:text-red-400 animate-fade-in">
                                <Icon name="AlertCircle" size={18} className="shrink-0 mt-0.5" />
                                <span>{error}</span>
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2 uppercase tracking-wider">Username</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                        <Icon name="User" size={18} />
                                    </div>
                                    <input 
                                        type="text" 
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        className="w-full pl-11 pr-4 h-12 text-sm bg-slate-50/50 dark:bg-[#0B1120]/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all placeholder-slate-400 text-slate-900 dark:text-slate-100" 
                                        placeholder="Masukkan username"
                                    />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2 uppercase tracking-wider">Password</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                        <Icon name="Lock" size={18} />
                                    </div>
                                    <input 
                                        type={showPassword ? "text" : "password"} 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full pl-11 pr-11 h-12 text-sm bg-slate-50/50 dark:bg-[#0B1120]/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all placeholder-slate-400 text-slate-900 dark:text-slate-100" 
                                        placeholder="••••••••"
                                    />
                                    <button 
                                        type="button"
                                        onClick={() => setShowPassword(!showPassword)}
                                        className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 focus:outline-none"
                                    >
                                        <Icon name={showPassword ? "EyeOff" : "Eye"} size={18} />
                                    </button>
                                </div>
                            </div>
                            
                            <div className="pt-2">
                                <button 
                                    type="submit" 
                                    disabled={isLoading}
                                    className="w-full h-12 px-4 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold rounded-xl shadow-lg shadow-brand-500/30 transition-all flex justify-center items-center focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 disabled:opacity-70"
                                >
                                    {isLoading ? <Icon name="Loader2" size={20} className="animate-spin-slow" /> : 'Masuk ke Sistem'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            )
        }


        // --- MAIN APP COMPONENT ---
        function App() {
            const [authUser, setAuthUser] = useState(() => {
                const savedUser = localStorage.getItem('formula_user');
                return savedUser ? JSON.parse(savedUser) : null;
            });

            const [activeMenu, setActiveMenu] = useState('dashboard');
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [isProfileOpen, setIsProfileOpen] = useState(false);
            
            const [materials, setMaterials] = useState([]);
            const [formulas, setFormulas] = useState([]);
            const [usersList, setUsersList] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [notification, setNotification] = useState(null);
            const [configError, setConfigError] = useState(false);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            useEffect(() => {
                if (authUser) fetchData();
            }, [authUser]);

            const showNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const handleLogin = (user) => {
                localStorage.setItem('formula_user', JSON.stringify(user));
                setAuthUser(user);
                showNotification(`Selamat datang, ${user['Nama Lengkap']}!`);
            };

            const handleLogout = () => {
                localStorage.removeItem('formula_user');
                setAuthUser(null);
                setFormulas([]);
                setMaterials([]);
                setUsersList([]);
                setActiveMenu('dashboard');
                setIsProfileOpen(false);
            };

            const fetchData = async () => {
                setIsLoading(true);
                setConfigError(false);

                if (!GOOGLE_APPS_SCRIPT_URL || GOOGLE_APPS_SCRIPT_URL === 'GANTI_DENGAN_URL_WEB_APP_ANDA') {
                    setConfigError(true);
                    setIsLoading(false);
                    return;
                }

                try {
                    const reqs = [
                        fetch(`${GOOGLE_APPS_SCRIPT_URL}?action=getMaterials`),
                        fetch(`${GOOGLE_APPS_SCRIPT_URL}?action=getFormulas`)
                    ];
                    if (authUser?.Role === 'Admin') reqs.push(fetch(`${GOOGLE_APPS_SCRIPT_URL}?action=getUsers`));

                    const responses = await Promise.all(reqs);
                    if (responses.some(res => !res.ok)) throw new Error("HTTP error");

                    const matData = await responses[0].json();
                    const formData = await responses[1].json();
                    setMaterials(matData);
                    setFormulas(formData);

                    if (authUser?.Role === 'Admin') {
                        const usersData = await responses[2].json();
                        setUsersList(usersData);
                    }
                } catch (error) {
                    showNotification('Gagal mengambil data dari server.', 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            if (!authUser) return <LoginView onLogin={handleLogin} />;

            const baseMenus = [
                { id: 'dashboard', icon: 'Home', label: 'Dashboard' },
                { id: 'input', icon: 'FilePlus', label: 'Input Formula' },
                { id: 'kalkulator', icon: 'Calculator', label: 'Kalkulator' },
                { id: 'data', icon: 'Database', label: 'Master Formula' },
            ];
            const menus = authUser?.Role === 'Admin' ? [...baseMenus, { id: 'users', icon: 'Users', label: 'Kelola User' }] : baseMenus;

            return (
                <div className={`flex min-h-screen print-full-width ${isSidebarOpen ? 'overflow-hidden' : ''}`}>
                    {isSidebarOpen && <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 md:hidden print-hide" onClick={() => setIsSidebarOpen(false)} />}

                    <aside className={`fixed top-0 left-0 h-full w-64 bg-white dark:bg-[#111827] border-r border-slate-200 dark:border-slate-800 z-50 transform transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 flex flex-col print-hide`}>
                        <div className="h-16 flex items-center px-6 border-b border-slate-200 dark:border-slate-800 shrink-0">
                            <div className="flex items-center space-x-2">
                                <div className="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center shadow-sm">
                                    <Icon name="Activity" size={18} className="text-white" />
                                </div>
                                <h1 className="text-xl font-bold tracking-tight text-slate-900 dark:text-white">FormulaPro</h1>
                            </div>
                            <button className="md:hidden ml-auto text-slate-500" onClick={() => setIsSidebarOpen(false)}>
                                <Icon name="X" size={20} />
                            </button>
                        </div>
                        
                        <div className="p-4 flex-1 overflow-y-auto">
                            <p className="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 mt-2">Menu Navigasi</p>
                            <nav className="space-y-1">
                                {menus.map((menu) => (
                                    <button
                                        key={menu.id}
                                        onClick={() => { setActiveMenu(menu.id); setIsSidebarOpen(false); }}
                                        className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition-all text-sm font-medium ${
                                            activeMenu === menu.id 
                                                ? 'bg-brand-50 text-brand-700 dark:bg-brand-500/10 dark:text-brand-400' 
                                                : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/50 hover:text-slate-900 dark:hover:text-slate-200'
                                        }`}
                                    >
                                        <Icon name={menu.icon} size={18} />
                                        <span>{menu.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </aside>

                    <main className="md:ml-64 flex-1 flex flex-col min-w-0 min-h-screen transition-all duration-300 print-full-width">
                        <header className="h-16 sticky top-0 z-30 bg-white/70 dark:bg-[#0B1120]/70 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 flex items-center justify-between shrink-0 print-hide">
                            <div className="flex items-center space-x-4">

                                                <button onClick={() => { setIsProfileOpen(false); showNotification('Menu Pengaturan (Coming Soon)', 'success'); }} className="w-full text-left px-4 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center space-x-2 transition-colors">

                        {notification && (

                        {configError && (

                        <div className="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full print-full-width">

                                    {activeMenu === 'input' && <InputFormulaView materials={materials} fetchData={fetchData} showNotification={showNotification} Icon={Icon} />}

                                    {activeMenu === 'data' && <DataTableView formulas={formulas} isLoading={isLoading} Icon={Icon} userRole={authUser.Role} fetchData={fetchData} showNotification={showNotification} />}

        // --- SUB KOMPONEN (DASHBOARD, INPUT, DATA, USERS) ---

        function DashboardView({ formulas, materials, Icon, user, setActiveMenu }) {
            const totalProduk = new Set(formulas.map(f => f['Nama Produk'])).size;
            const totalMaterial = materials.length;
            const totalFormula = formulas.length;
            const totalProduksi = formulas.reduce((acc, curr) => acc + (Number(curr.Kg) || 0), 0);

            const statCards = [
                { title: 'Total Produk', value: totalProduk, icon: 'Package', color: 'text-brand-600 dark:text-brand-400', bg: 'bg-brand-50 dark:bg-brand-500/10' },
                { title: 'Total Formula', value: totalFormula, icon: 'Layers', color: 'text-indigo-600 dark:text-indigo-400', bg: 'bg-indigo-50 dark:bg-indigo-500/10' },
                { title: 'Material Aktif', value: totalMaterial, icon: 'Database', color: 'text-emerald-600 dark:text-emerald-400', bg: 'bg-emerald-50 dark:bg-emerald-500/10' },
                { title: 'Estimasi Produksi (Kg)', value: totalProduksi.toFixed(1), icon: 'BarChart3', color: 'text-amber-600 dark:text-amber-400', bg: 'bg-amber-50 dark:bg-amber-500/10' },
            ];

            const quickActions = [
                { id: 'input', title: '+ Input Formula', desc: 'Tambah formula baru', icon: 'FilePlus', color: 'text-brand-600 dark:text-brand-400', bg: 'bg-brand-50 dark:bg-brand-500/10' },
                { id: 'kalkulator', title: 'Kalkulator', desc: 'Hitung formulasi', icon: 'Calculator', color: 'text-indigo-600 dark:text-indigo-400', bg: 'bg-indigo-50 dark:bg-indigo-500/10' },
                { id: 'data', title: 'Master Formula', desc: 'Kelola formula', icon: 'Database', color: 'text-emerald-600 dark:text-emerald-400', bg: 'bg-emerald-50 dark:bg-emerald-500/10' },
            ];

            if (user?.Role === 'Admin') {
                quickActions.push({ id: 'users', title: 'Kelola User', desc: 'Manajemen user', icon: 'Users', color: 'text-purple-600 dark:text-purple-400', bg: 'bg-purple-50 dark:bg-purple-500/10' });
            }

            // Memproses Data Formula Terbaru (Mengelompokkan berdasarkan Nama Produk + FA + REV)
            const groupedForLatest = useMemo(() => {
                const groups = [];
                const map = new Map();
                formulas.forEach(item => {
                    const key = `${item['Nama Produk']}_${item['FA']}_${item['REV']}_${item['QTY']}`;
                    if (!map.has(key)) {
                        const newGroup = {
                            key, 'Nama Produk': item['Nama Produk'], 'FA': item['FA'], 'REV': item['REV'], materialsCount: 0
                        };
                        map.set(key, newGroup);
                        groups.push(newGroup);
                    }
                    map.get(key).materialsCount += 1;
                });
                return groups.reverse().slice(0, 5);
            }, [formulas]);

            // Memproses Data Material Terbanyak Digunakan
            const topMaterials = useMemo(() => {
                const counts = {};
                formulas.forEach(item => {
                    const mat = item['Material'];
                    if(mat) {
                        counts[mat] = (counts[mat] || 0) + 1;
                    }
                });
                return Object.entries(counts)
                    .map(([name, count]) => ({ name, count }))
                    .sort((a, b) => b.count - a.count)
                    .slice(0, 5);
            }, [formulas]);

            return (
                <div className="space-y-8 animate-fade-in pb-10">
                    {/* SECTION 1 - Overview */}
                    <div>
                        <div className="mb-5">
                            <h3 className="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Overview</h3>
                            <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 font-medium">Pantau statistik formulasi dan penggunaan material secara real-time.</p>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                            {statCards.map((stat, idx) => (
                                <div key={idx} className="bg-white dark:bg-[#111827] p-6 rounded-[16px] border border-slate-200/80 dark:border-slate-800 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 flex flex-col justify-between print-border">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-sm font-semibold text-slate-500 dark:text-slate-400 tracking-wide">{stat.title}</h3>
                                        <div className={`p-2.5 rounded-[12px] ${stat.bg}`}>
                                            <Icon name={stat.icon} size={20} className={stat.color} />
                                        </div>
                                    </div>
                                    <div>
                                        <div className="text-3xl font-bold text-slate-900 dark:text-white tracking-tight leading-none">{stat.value}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* SECTION 2 - Quick Action */}
                    <div>
                        <div className="mb-4 border-b border-slate-200/80 dark:border-slate-800 pb-2">
                            <h3 className="text-lg font-bold text-slate-900 dark:text-white tracking-tight">Aksi Cepat</h3>
                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 font-medium">Akses fitur utama dengan cepat.</p>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">
                            {quickActions.map((action) => (
                                <button 
                                    key={action.id} 
                                    onClick={() => setActiveMenu(action.id)}
                                    className="bg-white dark:bg-[#111827] p-4 rounded-[16px] border border-slate-200/80 dark:border-slate-800 shadow-sm hover:shadow-md hover:border-slate-300 dark:hover:border-slate-700 hover:-translate-y-0.5 transition-all duration-200 flex items-center space-x-4 text-left w-full focus:outline-none focus:ring-2 focus:ring-brand-500/20"
                                >
                                    <div className={`p-3 rounded-xl shrink-0 ${action.bg}`}>
                                        <Icon name={action.icon} size={20} className={action.color} />
                                    </div>
                                    <div>
                                        <h4 className="text-sm font-bold text-slate-900 dark:text-white leading-tight">{action.title}</h4>
                                        <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">{action.desc}</p>
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* SECTION 3 & 4 - Formula Terbaru & Material Terbanyak */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        {/* Formula Terbaru */}
                        <div className="lg:col-span-2 bg-white dark:bg-[#111827] rounded-[16px] border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden flex flex-col">
                            <div className="p-5 border-b border-slate-200/80 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/20">
                                <h3 className="text-sm font-bold text-slate-900 dark:text-white tracking-tight">Formula Terbaru</h3>
                                <button onClick={() => setActiveMenu('data')} className="text-xs font-semibold text-brand-600 hover:text-brand-700 dark:text-brand-400 flex items-center transition-colors">
                                    Lihat Semua <Icon name="ArrowRight" size={14} className="ml-1" />
                                </button>
                            </div>
                            <div className="p-0 flex-1">
                                {groupedForLatest.length > 0 ? (
                                    <div className="divide-y divide-slate-100 dark:divide-slate-800/60">
                                        {groupedForLatest.map((form, idx) => (
                                            <div key={idx} className="p-4 sm:px-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
                                                <div className="flex items-start space-x-3">
                                                    <div className="w-8 h-8 rounded-full bg-brand-50 dark:bg-brand-500/10 flex items-center justify-center shrink-0 mt-0.5">
                                                        <Icon name="Layers" size={14} className="text-brand-600 dark:text-brand-400" />
                                                    </div>
                                                    <div>
                                                        <p className="text-sm font-bold text-slate-900 dark:text-white leading-tight">{form['Nama Produk']}</p>
                                                        <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 font-medium">FA {form['FA']} / REV {form['REV'] || '-'}</p>
                                                    </div>
                                                </div>
                                                <div className="sm:text-right shrink-0 ml-11 sm:ml-0">
                                                    <span className="inline-flex items-center bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 px-2.5 py-1 rounded-lg text-xs font-semibold">
                                                        {form.materialsCount} Material
                                                    </span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="p-8 text-center">
                                        <p className="text-sm text-slate-500 dark:text-slate-400">Belum ada formula.</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Material Terbanyak Digunakan */}
                        <div className="bg-white dark:bg-[#111827] rounded-[16px] border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden flex flex-col">
                            <div className="p-5 border-b border-slate-200/80 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/20">
                                <h3 className="text-sm font-bold text-slate-900 dark:text-white tracking-tight">Material Terbanyak Digunakan</h3>
                            </div>
                            <div className="p-0 flex-1">
                                {topMaterials.length > 0 ? (
                                    <div className="divide-y divide-slate-100 dark:divide-slate-800/60">
                                        {topMaterials.map((mat, idx) => (
                                            <div key={idx} className="p-4 sm:px-5 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
                                                <div className="flex items-center space-x-3 overflow-hidden pr-3">
                                                    <span className="text-xs font-bold text-slate-400 dark:text-slate-500 w-4 text-center">{idx + 1}</span>
                                                    <p className="text-sm font-medium text-slate-900 dark:text-slate-200 truncate">{mat.name}</p>
                                                </div>
                                                <span className="text-xs font-semibold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-500/10 px-2 py-1 rounded-md shrink-0">
                                                    {mat.count}x
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="p-8 text-center">
                                        <p className="text-sm text-slate-500 dark:text-slate-400">Belum ada data material.</p>
                                    </div>
                                )}
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        function InputFormulaView({ materials, fetchData, showNotification, Icon }) {
            const [headerData, setHeaderData] = useState({ namaProduk: '', fa: '', rev: '', qty: '' });
            const [materialsList, setMaterialsList] = useState([{ id: Date.now(), material: '', qtyMaterial: '', pail: '' }]);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleHeaderChange = (e) => {
                const { name, value } = e.target;
                setHeaderData(prev => ({ ...prev, [name]: value }));
            };

            const handleMaterialChange = (id, field, value) => {
                if (field === 'qtyMaterial' && value.includes('.')) {
                    if (value.split('.')[1].length > 5) return showNotification('Kebutuhan Dispense (Kg) maksimal 5 angka di belakang koma.', 'error');
                }
                setMaterialsList(prev => prev.map(m => m.id === id ? { ...m, [field]: value } : m));
            };

            const addMaterialRow = () => setMaterialsList(prev => [...prev, { id: Date.now(), material: '', qtyMaterial: '', pail: '' }]);
            const removeMaterialRow = (id) => { if (materialsList.length > 1) setMaterialsList(prev => prev.filter(m => m.id !== id)); };
            const handleReset = () => { setHeaderData({ namaProduk: '', fa: '', rev: '', qty: '' }); setMaterialsList([{ id: Date.now(), material: '', qtyMaterial: '', pail: '' }]); };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!headerData.namaProduk || !headerData.fa || !headerData.qty) return showNotification('Mohon lengkapi Informasi Produk dan Qty Total', 'error');
                for (let i = 0; i < materialsList.length; i++) {
                    const m = materialsList[i];
                    if (!m.material || !m.qtyMaterial || !m.pail) return showNotification(`Mohon lengkapi data Material ke-${i+1}`, 'error');
                }

                if (!GOOGLE_APPS_SCRIPT_URL || GOOGLE_APPS_SCRIPT_URL === 'GANTI_DENGAN_URL_WEB_APP_ANDA') return showNotification('Mode Preview: Data tidak dapat disimpan', 'error');

                setIsSubmitting(true);
                try {
                    for (const mat of materialsList) {
                        const baseQty = Number(headerData.qty);
                        const kg = (Number(mat.qtyMaterial) * baseQty) / 100;
                        const formulasi = baseQty !== 0 ? (Number(mat.pail) / baseQty) * kg : 0;
                        const payload = { action: 'addFormula', data: { 'Nama Produk': headerData.namaProduk, 'FA': headerData.fa, 'REV': headerData.rev, 'QTY': baseQty, 'Material': mat.material, 'Qty Material': Number(mat.qtyMaterial), 'Kg': kg, 'Pail': Number(mat.pail), 'Formulasi': formulasi } };
                        const response = await fetch(GOOGLE_APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                        if(!response.ok) throw new Error("Gagal menyimpan material: " + mat.material);
                    }
                    showNotification('Formula berhasil disimpan!');
                    handleReset();
                    await fetchData();
                } catch (error) {
                    showNotification(error.message || 'Terjadi kesalahan saat menyimpan', 'error');
                } finally {
                    setIsSubmitting(false);
                }
            };

            const inputClass = "w-full px-3 py-2 text-sm bg-white dark:bg-[#0B1120] border border-slate-300 dark:border-slate-700 rounded-lg shadow-sm focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none transition-all placeholder-slate-400 text-slate-900 dark:text-slate-100";
            const labelClass = "block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide";

            return (
                <div className="max-w-4xl">
                    <div className="mb-6">
                        <h2 className="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Input Formula Baru</h2>
                    </div>

                    <div className="bg-white dark:bg-[#111827] rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden print-border">
                        <form onSubmit={handleSubmit}>
                            <div className="p-5 sm:p-8 space-y-8">
                                {/* Informasi Produk */}
                                <div>
                                    <h3 className="text-sm font-semibold text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-2 mb-4">Informasi Produk</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5">
                                        <div className="sm:col-span-2"><label className={labelClass}>Nama Produk <span className="text-red-500">*</span></label><input type="text" name="namaProduk" value={headerData.namaProduk} onChange={handleHeaderChange} className={inputClass} required /></div>
                                        <div><label className={labelClass}>Kategori FA <span className="text-red-500">*</span></label><input type="text" name="fa" value={headerData.fa} onChange={handleHeaderChange} className={inputClass} required /></div>
                                        <div><label className={labelClass}>Revisi (REV)</label><input type="text" name="rev" value={headerData.rev} onChange={handleHeaderChange} className={inputClass} /></div>
                                    </div>
                                </div>

                                {/* Detail Material */}
                                <div>
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-2 mb-4 space-y-3 sm:space-y-0">
                                        <h3 className="text-sm font-semibold text-slate-900 dark:text-white">Detail Material & Kuantitas</h3>
                                        <div className="w-full sm:w-1/3">
                                            <label className="flex items-center text-xs font-semibold text-slate-700 dark:text-slate-300">
                                                <span className="mr-3 whitespace-nowrap">Qty Total <span className="text-red-500">*</span></span>
                                                <input type="number" name="qty" value={headerData.qty} onChange={handleHeaderChange} className={`${inputClass} !py-1.5`} placeholder="Contoh: 64" required min="1" step="any" />
                                            </label>
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        {materialsList.map((mat, index) => {
                                            const baseQty = Number(headerData.qty) || 0;
                                            const kg = baseQty ? (Number(mat.qtyMaterial) * baseQty) / 100 : 0;
                                            const formulasi = baseQty && kg ? (Number(mat.pail) / baseQty) * kg : 0;

                                            return (
                                                <div key={mat.id} className="p-4 sm:p-5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/20 relative group transition-colors">
