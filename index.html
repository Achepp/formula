        // --- UPDATED CALCULATOR VIEW ---
        function CalculatorView({ formulas, Icon }) {
            const [selectedProduct, setSelectedProduct] = useState('');
            const [selectedFA, setSelectedFA] = useState('');
            const [selectedREV, setSelectedREV] = useState('');
            const [qtyProduksi, setQtyProduksi] = useState('');
            const [pailProduksi, setPailProduksi] = useState('');

            // Dropdown List Logic
            const productList = [...new Set(formulas.map(f => String(f['Nama Produk'] || '')))].filter(Boolean);
            const faList = [...new Set(formulas.filter(f => String(f['Nama Produk'] || '') === selectedProduct).map(f => String(f['FA'] || '')))].filter(Boolean);
            const revList = [...new Set(formulas.filter(f => String(f['Nama Produk'] || '') === selectedProduct && String(f['FA'] || '') === selectedFA).map(f => String(f['REV'] || '')))].filter(Boolean);
            
            // Active Materials filtered by dropdown selections
            const activeMaterials = useMemo(() => {
                if (!selectedProduct || !selectedFA || !selectedREV) return [];
                return formulas.filter(f => 
                    String(f['Nama Produk'] || '') === selectedProduct && 
                    String(f['FA'] || '') === selectedFA &&
                    String(f['REV'] || '') === selectedREV
                );
            }, [formulas, selectedProduct, selectedFA, selectedREV]);

            // Set initial QTY from database when formula is completely selected
            useEffect(() => {
                if (activeMaterials.length > 0 && !qtyProduksi && !pailProduksi) {
                    setQtyProduksi(activeMaterials[0]['QTY'] || '');
                }
            }, [activeMaterials]);

            const handleProductChange = (e) => { setSelectedProduct(e.target.value); setSelectedFA(''); setSelectedREV(''); setQtyProduksi(''); setPailProduksi(''); };
            const handleFAChange = (e) => { setSelectedFA(e.target.value); setSelectedREV(''); setQtyProduksi(''); setPailProduksi(''); };
            const handleREVChange = (e) => { setSelectedREV(e.target.value); setQtyProduksi(''); setPailProduksi(''); };
            
            const handleReset = () => {
                setSelectedProduct(''); setSelectedFA(''); setSelectedREV(''); setQtyProduksi(''); setPailProduksi('');
            };

            // Calculations
            let totalKg = 0;
            let totalFormulasi = 0;
            const inputQtyNum = Number(qtyProduksi) || 0;
            const inputPailNum = Number(pailProduksi) || 0;

            const computedMaterials = activeMaterials.map(mat => {
                const baseQty = Number(mat['QTY']) || 1;
                const basePail = Number(mat['Pail']) || 1;
                const qtyMat = Number(mat['Qty Material']) || 0;
                
                const currentQty = inputQtyNum > 0 ? inputQtyNum : baseQty;
                const currentPail = inputPailNum > 0 ? inputPailNum : basePail;

                const kg = (qtyMat * currentQty) / 100;
                const formulasi = currentQty > 0 ? (currentPail / currentQty) * kg : 0;

                totalKg += kg;
                totalFormulasi += formulasi;

                return { 
                    ...mat, 
                    displayQty: currentQty,
                    displayPail: currentPail,
                    displayQtyMat: qtyMat, 
                    calculatedFormulasi: formulasi 
                };
            });

            const inputClass = "w-full px-3 py-2 text-sm bg-white dark:bg-[#0B1120] border border-slate-300 dark:border-slate-700 rounded-lg shadow-sm focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none transition-all placeholder-slate-400 text-slate-900 dark:text-slate-100";
            const labelClass = "block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide";

            return (
                <div className="max-w-4xl print-full-width">
                    <div className="mb-6 print-hide">
                        <h2 className="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Kalkulator Formula</h2>
                        <p className="text-sm text-slate-500 mt-1">Simulasikan perhitungan berdasarkan formula yang tersimpan di Master Formula.</p>
                    </div>

                    <div className="bg-white dark:bg-[#111827] rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden print-border">
                        <div className="p-5 sm:p-8 space-y-8">
                            
                            {/* SECTION 1 - Informasi Produk */}
                            <div>
                                <h3 className="text-sm font-semibold text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-2 mb-4">Informasi Produk</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-5">
                                    <div className="sm:col-span-3">
                                        <label className={labelClass}>Nama Produk</label>
                                        <select value={selectedProduct} onChange={handleProductChange} className={inputClass}>
                                            <option value="">-- Pilih Produk --</option>
                                            {productList.map(p => <option key={p} value={p}>{p}</option>)}
                                        </select>
                                    </div>
                                    <div className="sm:col-span-1.5">
                                        <label className={labelClass}>Kategori FA</label>
                                        <select value={selectedFA} onChange={handleFAChange} className={inputClass} disabled={!selectedProduct}>
                                            <option value="">-- Pilih FA --</option>
                                            {faList.map(fa => <option key={fa} value={fa}>{fa}</option>)}
                                        </select>
                                    </div>
                                    <div className="sm:col-span-1.5">
                                        <label className={labelClass}>Revisi (REV)</label>
                                        <select value={selectedREV} onChange={handleREVChange} className={inputClass} disabled={!selectedFA}>
                                            <option value="">-- Pilih REV --</option>
                                            {revList.map(rev => <option key={rev} value={rev}>{rev}</option>)}
                                        </select>
                                    </div>
                                </div>

                                {selectedProduct && selectedFA && selectedREV && activeMaterials.length === 0 && (
                                    <div className="mt-4 p-3 bg-amber-50 text-amber-600 rounded-lg text-sm border border-amber-200 print-hide">
                                        <Icon name="AlertCircle" className="inline mr-2" size={16} /> Formula tidak ditemukan untuk kombinasi ini.
                                    </div>
                                )}
                            </div>

                            {/* SECTION 2 - Detail Perhitungan (Hanya tampil jika ada data) */}
                            {activeMaterials.length > 0 && (
                                <div className="animate-fade-in">
                                    <h3 className="text-sm font-semibold text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-2 mb-4">Parameter Produksi (Kustomisasi)</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5 mb-8">
                                        <div>
                                            <label className={labelClass}>Target Qty</label>
                                            <input type="number" value={qtyProduksi} onChange={(e) => setQtyProduksi(e.target.value)} className={inputClass} placeholder="Contoh: 100" min="0" step="any" />
                                        </div>
                                        <div>
                                            <label className={labelClass}>Target Pail</label>
                                            <input type="number" value={pailProduksi} onChange={(e) => setPailProduksi(e.target.value)} className={inputClass} placeholder="Contoh: 20" min="0" step="any" />
                                        </div>
                                    </div>

                                    {/* HASIL PERHITUNGAN */}
                                    <h3 className="text-sm font-semibold text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-2 mb-4">Hasil Simulasi</h3>
                                    
                                    {/* Card Ringkasan */}
                                    <div className="bg-brand-50 dark:bg-brand-900/20 border border-brand-200 dark:border-brand-800 rounded-xl p-4 sm:p-5 mb-6 flex flex-col sm:flex-row justify-between gap-4">
                                        <div>
                                            <p className="text-xs text-brand-600 dark:text-brand-400 font-semibold uppercase tracking-wider mb-1">Informasi</p>
                                            <div className="text-sm text-slate-800 dark:text-slate-200 space-y-1">
                                                <div><span className="text-slate-500 dark:text-slate-400">Nama Produk:</span> <span className="font-bold">{selectedProduct}</span></div>
                                                <div><span className="text-slate-500 dark:text-slate-400">FA / REV:</span> <span className="font-bold">{selectedFA} / {selectedREV}</span></div>
                                                <div><span className="text-slate-500 dark:text-slate-400">Jumlah Material:</span> <span className="font-bold">{activeMaterials.length}</span></div>
                                            </div>
                                        </div>
                                        <div className="sm:text-right">
                                            <p className="text-xs text-brand-600 dark:text-brand-400 font-semibold uppercase tracking-wider mb-1">Total</p>
                                            <div className="text-sm text-slate-800 dark:text-slate-200 space-y-1">
                                                <div><span className="text-slate-500 dark:text-slate-400">Total Kg:</span> <span className="font-bold text-lg text-brand-700 dark:text-brand-300 ml-2">{Number(totalKg.toFixed(5))}</span></div>
                                                <div><span className="text-slate-500 dark:text-slate-400">Total Formulasi:</span> <span className="font-bold text-lg text-emerald-600 dark:text-emerald-400 ml-2">{Number(totalFormulasi.toFixed(5))}</span></div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Tabel Detail */}
                                    <div className="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-700">
                                        <table className="w-full text-left text-sm whitespace-nowrap">
                                            <thead className="bg-slate-100 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700">
                                                <tr>
                                                    <th className="px-4 py-3 font-semibold text-slate-600 dark:text-slate-300 w-12 text-center">No</th>
                                                    <th className="px-4 py-3 font-semibold text-slate-600 dark:text-slate-300">Material</th>
                                                    <th className="px-4 py-3 font-semibold text-slate-600 dark:text-slate-300 text-right">Qty Total</th>
                                                    <th className="px-4 py-3 font-semibold text-slate-600 dark:text-slate-300 text-right">Kebutuhan Dispense (Kg)</th>
                                                    <th className="px-4 py-3 font-semibold text-slate-600 dark:text-slate-300 text-right">Pail</th>
                                                    <th className="px-4 py-3 font-semibold text-emerald-600 dark:text-emerald-400 text-right">Formulasi</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 dark:divide-slate-800/50">
                                                {computedMaterials.map((mat, idx) => (
                                                    <tr key={idx} className="hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
                                                        <td className="px-4 py-2.5 text-center text-slate-500 dark:text-slate-400">{idx + 1}</td>
                                                        <td className="px-4 py-2.5 font-medium text-slate-900 dark:text-slate-200">{mat['Material']}</td>
                                                        <td className="px-4 py-2.5 text-slate-600 dark:text-slate-400 text-right">{mat.displayQty}</td>
                                                        <td className="px-4 py-2.5 text-slate-600 dark:text-slate-400 text-right bg-slate-50/50 dark:bg-slate-900/20">{Number(mat.displayQtyMat.toFixed(5))}</td>
                                                        <td className="px-4 py-2.5 text-slate-600 dark:text-slate-400 text-right">{mat.displayPail}</td>
                                                        <td className="px-4 py-2.5 font-semibold text-emerald-700 dark:text-emerald-300 text-right bg-emerald-50/30 dark:bg-emerald-900/10">{Number(mat.calculatedFormulasi.toFixed(5))}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                        </div>
                        
                        {/* Area Aksi Tombol */}
                        <div className="px-5 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row items-center justify-end space-y-3 sm:space-y-0 sm:space-x-3 print-hide">
                            <button type="button" onClick={handleReset} className="w-full sm:w-auto px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-200 hover:text-slate-900 dark:hover:bg-slate-700 dark:hover:text-white rounded-lg transition-colors">
                                Reset Parameter
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function DataTableView({ formulas, isLoading, Icon, userRole, fetchData, showNotification }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [currentPage, setCurrentPage] = useState(1);
            const [expandedRows, setExpandedRows] = useState(new Set());
            const [groupToDelete, setGroupToDelete] = useState(null);
            const [isDeletingGroup, setIsDeletingGroup] = useState(false);
            const itemsPerPage = 10;

            const groupedFormulas = useMemo(() => {
                const groups = {};
                formulas.forEach(item => {
                    const key = `${item['Nama Produk']}_${item['FA']}_${item['REV']}_${item['QTY']}`;
                    if (!groups[key]) {
                        groups[key] = {
                            key, 'Nama Produk': item['Nama Produk'], 'FA': item['FA'], 'REV': item['REV'], 'QTY': item['QTY'], materials: []
                        };
                    }
                    groups[key].materials.push(item);
                });
                return Object.values(groups);
            }, [formulas]);

            const filteredData = groupedFormulas.filter(group => {
                const searchLower = searchTerm.toLowerCase();
                return (
                    String(group['Nama Produk']).toLowerCase().includes(searchLower) ||
                    String(group['FA']).toLowerCase().includes(searchLower) ||
                    String(group['REV']).toLowerCase().includes(searchLower) ||
                    group.materials.some(mat => String(mat['Material']).toLowerCase().includes(searchLower))
                );
            });

            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            const currentData = filteredData.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            const toggleRow = (key) => {
                const newExpanded = new Set(expandedRows);
                if (newExpanded.has(key)) newExpanded.delete(key);
                else newExpanded.add(key);
                setExpandedRows(newExpanded);
            };

            const exportToCSV = () => {
                if(!formulas.length) return;
                const headers = ["Nama Produk", "FA", "REV", "Qty Total", "Material", "Kebutuhan Dispense (Kg)", "Pail", "Formulasi"];
                const csvRows = [headers.join(',')];
                formulas.forEach(row => {
                    const values = [
                        `"${('' + row['Nama Produk']).replace(/"/g, '\\"')}"`,
                        `"${('' + row['FA']).replace(/"/g, '\\"')}"`,
                        `"${('' + row['REV']).replace(/"/g, '\\"')}"`,
                        `"${('' + row['QTY']).replace(/"/g, '\\"')}"`,
                        `"${('' + row['Material']).replace(/"/g, '\\"')}"`,
                        `"${('' + row['Qty Material']).replace(/"/g, '\\"')}"`,
                        `"${('' + row['Pail']).replace(/"/g, '\\"')}"`,
                        `"${('' + row['Formulasi']).replace(/"/g, '\\"')}"`
                    ];
                    csvRows.push(values.join(','));
                });
                const link = document.createElement("a");
                link.setAttribute("href", encodeURI("data:text/csv;charset=utf-8," + csvRows.join('\n')));
                link.setAttribute("download", "data_formula.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleDeleteGroupConfirm = async () => {
                if (!groupToDelete) return;
                setIsDeletingGroup(true);
                try {
                    const idsToDelete = groupToDelete.materials.map(m => m.id).sort((a, b) => b - a);
                    for (const id of idsToDelete) {
                        const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
                            method: 'POST', body: JSON.stringify({ action: 'deleteFormula', id }),
                        });
                        if (!response.ok) throw new Error("Gagal menghapus baris");
                    }
                    await fetchData();
                    showNotification('Formula berhasil dihapus.', 'success');
                    setGroupToDelete(null);
                } catch (error) {
                    showNotification('Gagal menghapus formula. Silakan coba kembali.', 'error');
                } finally {
                    setIsDeletingGroup(false);
                }
            };

            return (
                <div className="bg-white dark:bg-[#111827] rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col animate-fade-in relative print-border">
                    <div className="p-5 border-b border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center space-y-4 sm:space-y-0">
                        <div>
                            <h3 className="text-lg font-bold text-slate-900 dark:text-white">Master Formula</h3>
                            <p className="text-xs text-slate-500 mt-1">Total {groupedFormulas.length} kombinasi formula (dari {formulas.length} data material).</p>
                        </div>
                        <div className="flex flex-col sm:flex-row items-center space-y-3 sm:space-y-0 sm:space-x-3 w-full sm:w-auto print-hide">
                            <div className="relative flex-1 w-full sm:w-64">
                                <div className="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"><Icon name="Search" size={16} /></div>
                                <input 
                                    type="text" placeholder="Cari referensi..." value={searchTerm} onChange={(e) => { setSearchTerm(e.target.value); setCurrentPage(1); }}
                                    className="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 dark:bg-[#0B1120] border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all placeholder-slate-400 text-slate-900 dark:text-slate-100"
                                />
                            </div>
                            <button onClick={exportToCSV} className="w-full sm:w-auto flex items-center justify-center space-x-2 bg-white dark:bg-[#111827] border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                                <Icon name="Download" size={16} /> <span>Ekspor CSV</span>
                            </button>
                        </div>
                    </div>

                    <div className="overflow-x-auto">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-slate-50/50 dark:bg-slate-800/30 border-b border-slate-200 dark:border-slate-800">
                                <tr>
                                    <th className="px-5 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wider w-16">No</th>
                                    <th className="px-5 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wider">Nama Produk</th>
                                    <th className="px-5 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wider">FA/REV</th>
                                    <th className="px-5 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wider">Qty Total</th>
                                    <th className="px-5 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wider">Jumlah Material</th>
                                    <th className="px-5 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wider text-right print-hide">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 dark:divide-slate-800/60">
                                {currentData.length > 0 ? currentData.map((group, idx) => {
                                    const isExpanded = expandedRows.has(group.key);
                                    const globalIndex = (currentPage - 1) * itemsPerPage + idx + 1;
                                    return (
                                        <Fragment key={group.key}>
                                            <tr className={`hover:bg-slate-50 dark:hover:bg-slate-800/30 cursor-pointer transition-colors ${isExpanded ? 'bg-slate-50 dark:bg-slate-800/20' : ''}`} onClick={() => toggleRow(group.key)}>
                                                <td className="px-5 py-4 text-slate-500 dark:text-slate-400 font-medium">{globalIndex}</td>
                                                <td className="px-5 py-4 font-medium text-slate-900 dark:text-slate-200">{group['Nama Produk']}</td>
                                                <td className="px-5 py-4 text-slate-600 dark:text-slate-400">
                                                    <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-slate-300">
                                                        {group['FA']}/{group['REV'] || '-'}
                                                    </span>
                                                </td>
                                                <td className="px-5 py-4 text-slate-600 dark:text-slate-400">{group['QTY']}</td>
                                                <td className="px-5 py-4 text-slate-600 dark:text-slate-400">
                                                    <span className="inline-flex items-center bg-brand-50 text-brand-700 dark:bg-brand-500/10 dark:text-brand-400 px-2 py-0.5 rounded-full text-xs font-medium">
                                                        {group.materials.length} Material
                                                    </span>
                                                </td>
                                                <td className="px-5 py-4 text-right print-hide">
                                                    <div className="flex items-center justify-end space-x-2">
                                                        <button onClick={(e) => { e.stopPropagation(); toggleRow(group.key); }} className="px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-md text-xs font-medium transition-colors shadow-sm focus:outline-none flex items-center space-x-1">
                                                            <span>Detail</span><Icon name={isExpanded ? "ChevronUp" : "ChevronDown"} size={14} />
                                                        </button>
                                                        {userRole === 'Admin' && (
                                                            <Fragment>
                                                                <button 
                                                                    onClick={(e) => { e.stopPropagation(); showNotification('Fitur Edit akan segera hadir.', 'success'); }} 
                                                                    className="p-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-brand-50 hover:text-brand-600 hover:border-brand-200 dark:hover:bg-brand-900/20 dark:hover:text-brand-400 text-slate-600 dark:text-slate-400 rounded-md transition-colors shadow-sm focus:outline-none"
                                                                    title="Edit Formula Group"
                                                                >
                                                                    <Icon name="Edit" size={14} />
                                                                </button>
                                                                <button 
                                                                    onClick={(e) => { e.stopPropagation(); setGroupToDelete(group); }} 
                                                                    className="p-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-red-50 hover:text-red-600 hover:border-red-200 dark:hover:bg-red-900/20 dark:hover:text-red-400 text-slate-600 dark:text-slate-400 rounded-md transition-colors shadow-sm focus:outline-none relative group/btn"
                                                                    title={`Hapus seluruh formula beserta ${group.materials.length} material yang terkait.`}
                                                                >
                                                                    <Icon name="Trash2" size={14} />
                                                                </button>
                                                            </Fragment>
                                                        )}
                                                    </div>
                                                </td>
                                            </tr>
                                            {isExpanded && (
                                                <tr>
                                                    <td colSpan="6" className="p-0 bg-slate-50/30 dark:bg-[#0B1120]/30">
                                                        <div className="mx-0 sm:mx-5 my-0 sm:my-4 bg-white dark:bg-[#111827] sm:border-l-4 sm:border-brand-500 sm:rounded-r-xl shadow-sm sm:border-t sm:border-r sm:border-b border-slate-200 dark:border-slate-800 overflow-hidden animate-slide-in-up print-border">
                                                            <div className="overflow-x-auto p-4">
                                                                <table className="w-full text-left text-xs whitespace-nowrap border border-slate-200 dark:border-slate-700 rounded-lg overflow-hidden">
                                                                    <thead className="bg-slate-100 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700">
                                                                        <tr>
                                                                            <th className="px-4 py-2 font-semibold text-slate-600 dark:text-slate-300 w-12">No</th>
                                                                            <th className="px-4 py-2 font-semibold text-slate-600 dark:text-slate-300">Material</th>
                                                                            <th className="px-4 py-2 font-semibold text-slate-600 dark:text-slate-300 text-right">Qty Total</th>
                                                                            <th className="px-4 py-2 font-semibold text-slate-600 dark:text-slate-300 text-right">Kebutuhan Dispense (Kg)</th>
                                                                            <th className="px-4 py-2 font-semibold text-slate-600 dark:text-slate-300 text-right">Kg</th>
                                                                            <th className="px-4 py-2 font-semibold text-slate-600 dark:text-slate-300 text-right">Pail</th>
                                                                            <th className="px-4 py-2 font-semibold text-slate-600 dark:text-slate-300 text-right">Formulasi</th>
                                                                        </tr>
                                                                    </thead>
                                                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800/50">
                                                                        {group.materials.map((mat, mIdx) => (
                                                                            <tr key={mIdx} className="hover:bg-slate-50 dark:hover:bg-slate-800/20 transition-colors">
                                                                                <td className="px-4 py-2.5 text-slate-500 dark:text-slate-400">{mIdx + 1}</td>
                                                                                <td className="px-4 py-2.5 font-medium text-slate-900 dark:text-slate-200">{mat['Material']}</td>
                                                                                <td className="px-4 py-2.5 text-slate-600 dark:text-slate-400 text-right">{mat['QTY'] || '-'}</td>
                                                                                <td className="px-4 py-2.5 text-slate-600 dark:text-slate-400 text-right">{mat['Qty Material'] !== '' && mat['Qty Material'] !== undefined ? Number(Number(mat['Qty Material']).toFixed(5)) : '-'}</td>
                                                                                <td className="px-4 py-2.5 text-slate-600 dark:text-slate-400 text-right">{mat['Kg'] !== '' && mat['Kg'] !== undefined ? Number(Number(mat['Kg']).toFixed(5)) : '-'}</td>
                                                                                <td className="px-4 py-2.5 text-slate-600 dark:text-slate-400 text-right">{mat['Pail'] || '-'}</td>
                                                                                <td className="px-4 py-2.5 font-semibold text-brand-600 dark:text-brand-400 text-right">{Number(mat['Formulasi']).toFixed(4)}</td>
                                                                            </tr>
                                                                        ))}
                                                                    </tbody>
                                                                </table>
                                                                <div className="mt-4 flex flex-col sm:flex-row sm:space-x-8 space-y-2 sm:space-y-0 text-sm p-3 bg-slate-50 dark:bg-slate-800/30 rounded-lg border border-slate-100 dark:border-slate-800/50">
                                                                    <div className="font-medium text-slate-600 dark:text-slate-400">Total Material : <span className="font-bold text-slate-900 dark:text-white ml-1">{group.materials.length}</span></div>
                                                                    <div className="font-medium text-slate-600 dark:text-slate-400">Total Formulasi : <span className="font-bold text-brand-600 dark:text-brand-400 ml-1">{group.materials.reduce((sum, mat) => sum + Number(mat['Formulasi'] || 0), 0).toFixed(4)}</span></div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                        </Fragment>
                                    );
                                }) : (
                                    <tr><td colSpan="6" className="px-5 py-8 text-center text-slate-500 text-sm">{isLoading ? <div className="flex items-center justify-center"><Icon name="Loader2" size={16} className="animate-spin-slow mr-2" /> Menarik data...</div> : 'Tidak ada data ditemukan'}</td></tr>
                                )}
                            </tbody>
                        </table>
                    </div>

                    {totalPages > 1 && (
                        <div className="px-5 py-4 border-t border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row justify-between items-center bg-white dark:bg-[#111827] rounded-b-xl gap-4 print-hide">
                            <span className="text-xs text-slate-500">Menampilkan <span className="font-medium text-slate-900 dark:text-slate-200">{((currentPage - 1) * itemsPerPage) + 1}</span> - <span className="font-medium text-slate-900 dark:text-slate-200">{Math.min(currentPage * itemsPerPage, filteredData.length)}</span> dari <span className="font-medium text-slate-900 dark:text-slate-200">{filteredData.length}</span> formula</span>
                            <div className="flex space-x-1">
                                <button disabled={currentPage === 1} onClick={() => setCurrentPage(prev => Math.max(1, prev - 1))} className="px-3 py-1.5 rounded-md border border-slate-200 dark:border-slate-700 text-xs font-medium text-slate-600 dark:text-slate-300 disabled:opacity-50 hover:bg-slate-50 dark:hover:bg-slate-800 focus:outline-none">Prev</button>
                                <button disabled={currentPage === totalPages} onClick={() => setCurrentPage(prev => Math.min(totalPages, prev + 1))} className="px-3 py-1.5 rounded-md border border-slate-200 dark:border-slate-700 text-xs font-medium text-slate-600 dark:text-slate-300 disabled:opacity-50 hover:bg-slate-50 dark:hover:bg-slate-800 focus:outline-none">Next</button>
                            </div>
                        </div>
                    )}

                    {groupToDelete && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in print-hide">
                            <div className="bg-white dark:bg-[#111827] rounded-xl shadow-2xl border border-slate-200 dark:border-slate-800 max-w-[380px] w-[380px] p-5 overflow-hidden animate-zoom-in">
                                <div className="flex items-center justify-center w-9 h-9 mx-auto bg-red-100 dark:bg-red-900/30 rounded-full mb-3">
                                    <Icon name="AlertTriangle" size={20} className="text-red-600 dark:text-red-400" />
                                </div>
                                <h3 className="text-lg font-semibold text-center text-slate-900 dark:text-white mb-2">Hapus Formula?</h3>
                                <p className="text-sm text-center text-slate-500 dark:text-slate-400 mb-4">Formula berikut akan dihapus secara permanen.</p>
                                
                                <div className="text-sm text-slate-700 dark:text-slate-300 mb-4 space-y-1">
                                    <div className="flex"><span className="w-24 shrink-0 text-slate-500">Nama Produk</span> <span className="font-medium truncate">: {groupToDelete['Nama Produk']}</span></div>
                                    <div className="flex"><span className="w-24 shrink-0 text-slate-500">FA/REV</span> <span className="font-medium">: {groupToDelete['FA']} / {groupToDelete['REV'] || '-'}</span></div>
                                    <div className="flex"><span className="w-24 shrink-0 text-slate-500">Qty Total</span> <span className="font-medium">: {groupToDelete['QTY']}</span></div>
                                    <div className="flex"><span className="w-24 shrink-0 text-slate-500">Material</span> <span className="font-medium text-brand-600 dark:text-brand-400">: {groupToDelete.materials.length} Material</span></div>
                                </div>
                                
                                <p className="text-xs text-center text-red-600 dark:text-red-400 font-medium mb-5">Data yang dihapus tidak dapat dikembalikan.</p>
                                
                                <div className="flex space-x-3">
                                    <button 
                                        onClick={() => setGroupToDelete(null)}
                                        disabled={isDeletingGroup}
                                        className="flex-1 h-10 text-sm font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors disabled:opacity-50 focus:outline-none focus:ring-2 focus:ring-slate-200"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        onClick={handleDeleteGroupConfirm}
                                        disabled={isDeletingGroup}
                                        className="flex-1 h-10 flex items-center justify-center text-sm font-medium text-white bg-red-600 border border-transparent rounded-lg hover:bg-red-700 transition-colors disabled:opacity-70 focus:outline-none focus:ring-2 focus:ring-red-500/50"
                                    >
                                        {isDeletingGroup ? <Icon name="Loader2" size={16} className="animate-spin-slow mr-2" /> : null}
                                        {isDeletingGroup ? 'Menghapus...' : 'Hapus'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function UserManagementView({ users, fetchData, showNotification, Icon }) {
            const [formData, setFormData] = useState({ Username: '', Password: '', 'Nama Lengkap': '', Role: 'User' });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.Username || !formData.Password || !formData['Nama Lengkap']) return showNotification('Lengkapi semua data', 'error');

                setIsSubmitting(true);
                try {
                    const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
                        method: 'POST', body: JSON.stringify({ action: 'addUser', data: formData })
                    });
                    const resData = await response.json();
                    if(resData.status !== 'success') throw new Error(resData.message || "Gagal menyimpan");
                    
                    showNotification('User berhasil ditambahkan');
                    setFormData({ Username: '', Password: '', 'Nama Lengkap': '', Role: 'User' });
                    fetchData();
                } catch (error) {
                    showNotification(error.message || 'Terjadi kesalahan server', 'error');
                } finally {
                    setIsSubmitting(false);
                }
            };

            const inputClass = "w-full px-3 py-2 text-sm bg-slate-50 dark:bg-[#0B1120] border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all text-slate-900 dark:text-white";

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="mb-6">
                        <h2 className="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Kelola User</h2>
                        <p className="text-sm text-slate-500 mt-1">Tambahkan dan atur hak akses staff Anda.</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-1 bg-white dark:bg-[#111827] rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm p-6 h-fit">
                            <h3 className="text-md font-bold text-slate-900 dark:text-white mb-5 flex items-center pb-3 border-b border-slate-100 dark:border-slate-800">
                                <Icon name="User" className="mr-2 text-brand-500"/> Tambah User Baru
                            </h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div><label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Nama Lengkap</label><input type="text" value={formData['Nama Lengkap']} onChange={e => setFormData({...formData, 'Nama Lengkap': e.target.value})} className={inputClass} required placeholder="John Doe"/></div>
                                <div><label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Username</label><input type="text" value={formData.Username} onChange={e => setFormData({...formData, Username: e.target.value})} className={inputClass} required placeholder="johndoe"/></div>
                                <div><label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Password</label><input type="password" value={formData.Password} onChange={e => setFormData({...formData, Password: e.target.value})} className={inputClass} required placeholder="••••••" /></div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Akses Role</label>
                                    <select value={formData.Role} onChange={e => setFormData({...formData, Role: e.target.value})} className={inputClass}>
                                        <option value="User">User (Akses Standard)</option>
                                        <option value="Admin">Admin (Akses Penuh)</option>
                                    </select>
                                </div>
                                <button type="submit" disabled={isSubmitting} className="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg flex justify-center items-center mt-6 transition-colors shadow-sm">
                                    {isSubmitting ? <Icon name="Loader2" className="animate-spin-slow mr-2"/> : <Icon name="CheckCircle" className="mr-2"/>} Simpan User
                                </button>
                            </form>
                        </div>

                        <div className="lg:col-span-2 bg-white dark:bg-[#111827] rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                            <div className="p-5 border-b border-slate-200 dark:border-slate-800">
                                <h3 className="text-md font-bold text-slate-900 dark:text-white">Daftar Pengguna</h3>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-slate-50/50 dark:bg-slate-800/30 border-b border-slate-200 dark:border-slate-800">
                                        <tr>
                                            <th className="px-5 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wider">Nama Lengkap</th>
                                            <th className="px-5 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wider">Username</th>
                                            <th className="px-5 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wider">Role</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800/60">
                                        {users.length > 0 ? users.map((u, i) => (
                                            <tr key={i} className="hover:bg-slate-50 dark:hover:bg-slate-800/30">
                                                <td className="px-5 py-3.5 font-medium text-slate-900 dark:text-slate-100">{u['Nama Lengkap']}</td>
                                                <td className="px-5 py-3.5 text-slate-600 dark:text-slate-400">{u.Username}</td>
                                                <td className="px-5 py-3.5">
                                                    <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold ${u.Role === 'Admin' ? 'bg-purple-100 text-purple-800 dark:bg-purple-900/30 dark:text-purple-400' : 'bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-slate-300'}`}>
                                                        {u.Role}
                                                    </span>
                                                </td>
                                            </tr>
                                        )) : (
                                            <tr><td colSpan="3" className="px-5 py-8 text-center text-slate-500 text-sm">Tidak ada data pengguna.</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
